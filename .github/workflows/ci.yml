name: CI

# Pull requests and pushes to main (development) and release (the latest
# release): the checks (check.yml) and the Docker image. A push to main also
# publishes vvorth/garmin-wf-builder:dev and dev-<commit> once the check and
# the image pass.
# A check that already passed on this exact commit (a pull request merged into
# main, release fast-forwarded to main) is not repeated: check runs are looked
# up by commit, not by branch.
# Releases are in release.yml.
on:
  push:
    branches: [main, release]
  pull_request:

permissions:
  contents: read

# Only the newest commit of a branch or pull request matters, dev images included.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tested:
    name: Checks already passed on this commit
    runs-on: ubuntu-latest
    permissions:
      checks: read
    outputs:
      check: ${{ steps.runs.outputs.check }}
    steps:
      - id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          # a pull request runs on a merge commit; its check runs are filed under the head commit
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          passed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success") | .name')
          if grep -qx ".*Type check and tests" <<<"$passed"; then
            echo "check=true" >> "$GITHUB_OUTPUT"
            echo "Type check and tests: already passed on $SHA, skipped"
          else
            echo "check=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: tested
    if: needs.tested.outputs.check != 'true'
    uses: ./.github/workflows/check.yml

  docker:
    name: Docker image
    needs: [tested, check]
    # release gets commits already built on main; its images are built by release.yml.
    # A check skipped as already passed counts as passed.
    if: >-
      ${{ !cancelled()
      && (needs.check.result == 'success' || (needs.check.result == 'skipped' && needs.tested.outputs.check == 'true'))
      && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    uses: ./.github/workflows/docker.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'dev' || '' }}
    secrets: inherit

  docker-cleanup:
    name: Remove old dev tags
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deleting tags needs a Docker Hub token with the Delete permission. Without it this job
    # warns and fails on its own, but the dev image is already published.
    continue-on-error: true
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "^24.22.1"
      - name: Remove old dev tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KEEP_DEV_TAGS: 10
        run: |
          node <<'NODE'
          const api = 'https://hub.docker.com/v2';
          const repo = 'vvorth/garmin-wf-builder';
          const keep = Number(process.env.KEEP_DEV_TAGS);

          async function call(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok)
              throw new Error(`${options.method || 'GET'} ${url}: ${response.status} ${await response.text()}`);
            return (response.status === 204 ? null : response.json());
          }

          (async() => {
            const {access_token: token} = await call(`${api}/auth/token`, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({identifier: process.env.DOCKERHUB_USERNAME, secret: process.env.DOCKERHUB_TOKEN}),
            });
            const headers = {Authorization: `Bearer ${token}`};

            const tags = [];
            for (let url = `${api}/repositories/${repo}/tags?page_size=100`; url;) {
              const page = await call(url, {headers});
              tags.push(...page.results);
              url = page.next;
            }

            // Only per-commit dev tags: dev, latest and version tags are never removed.
            const pushedAt = tag => Date.parse(tag.tag_last_pushed || tag.last_updated);
            const old = tags
              .filter(tag => /^dev-[0-9a-f]{7}$/.test(tag.name))
              .sort((a, b) => pushedAt(b) - pushedAt(a))
              .slice(keep);
            for (const tag of old) {
              await call(`${api}/repositories/${repo}/tags/${tag.name}/`, {method: 'DELETE', headers});
              console.log(`Removed ${repo}:${tag.name}`);
            }
            console.log(`Kept the newest ${keep} dev-<commit> tags, removed ${old.length}`);
          })().catch(error => {
            console.log(`::warning::Old dev tags were not removed: ${error.message}`);
            process.exitCode = 1;
          });
          NODE
