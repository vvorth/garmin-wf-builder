name: Release

# Rolling release: Actions -> Release -> Run workflow publishes the current head of main as
# version YY.M.N (26.10.0, 26.10.1, ...: N counts the releases of the month). After the check
# passes it fast-forwards the release branch to that commit and tags it, then publishes a GitHub release
# whose notes list the commits since the previous release, and the image to Docker Hub as
# vvorth/garmin-wf-builder:<version> and latest, and refreshes the Docker Hub page from
# DOCKERHUB.md.
# Nothing is committed: the release version lives in the tag, the release and the image's
# org.opencontainers.image.version label. ts/src/version.ts, which every generated file's
# header names, is the compiler's own version and is changed by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Pick the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # All tags are needed to number the release within its month and to find the previous one.
          fetch-depth: 0
      - id: version
        run: |
          sha=$(git rev-parse HEAD)
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || true)
          if [ -n "$previous" ] && [ "$(git rev-list --count "$previous..HEAD")" = 0 ]; then
            echo "::error::main ($sha) is already released as $previous: nothing to release"
            exit 1
          fi
          # SemVer forbids leading zeros, so the month is 9, not 09.
          month="$(date -u +%y).$(date -u +%-m)"
          last=$(git tag --list "v$month.*" | sed -n "s/^v$month\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          version="$month.$(( ${last:--1} + 1 ))"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $sha as $version (previous release: ${previous:-none})"

  check:
    needs: version
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      strict_audit: true

  # The image is built and tested before anything is pushed; only publishing waits for the tag.
  docker-test:
    name: Docker image
    needs: version
    uses: ./.github/workflows/docker.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  tag:
    name: Tag the release
    needs: [version, check, docker-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ needs.version.outputs.sha }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      # Full history: git checks locally that release is an ancestor of the release commit, and a
      # shallow clone lacks release's commit whenever it is behind main ("rejected (fetch first)").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      # One atomic push: if release is not an ancestor of the release commit, nothing is pushed
      # and nothing is published.
      - name: Push the release branch and the tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release ${TAG#v}" "$SHA"
          git push --atomic origin "$SHA:refs/heads/release" "refs/tags/$TAG"

  github-release:
    name: GitHub release
    needs: [version, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$TAG^" 2>/dev/null || true)
          {
            echo "Docker image: \`docker pull vvorth/garmin-wf-builder:${TAG#v}\` (see docs/container.md)."
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' ${previous:+"$previous.."}"$TAG"
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ needs.version.outputs.version }}
          make_latest: true
          body_path: release-notes.md

  docker:
    name: Docker image
    needs: [version, tag]
    uses: ./.github/workflows/docker.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      publish: ${{ needs.version.outputs.version }}
    secrets: inherit

  docker-hub-page:
    name: Docker Hub page
    needs: [version, docker]
    runs-on: ubuntu-latest
    # Editing the repository page needs a Docker Hub token with the Read, Write, Delete
    # permission. Without it this job warns and fails on its own; the release is out.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "^24.22.1"
      # The overview is DOCKERHUB.md as released; the short description is kept here.
      - name: Update the description and overview
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DESCRIPTION: 'Visual editor and compiler for Garmin Connect IQ watch faces: YAML in, signed sideloadable .prg out'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const api = 'https://hub.docker.com/v2';
          const repo = 'vvorth/garmin-wf-builder';

          async function call(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok)
              throw new Error(`${options.method || 'GET'} ${url}: ${response.status} ${await response.text()}`);
            return response.json();
          }

          (async() => {
            const description = process.env.DESCRIPTION;
            const overview = fs.readFileSync('DOCKERHUB.md', 'utf8');
            // Docker Hub's limits
            if (description.length > 100) throw new Error(`the description is ${description.length} characters, over 100`);
            if (overview.length > 25000) throw new Error(`DOCKERHUB.md is ${overview.length} characters, over 25000`);

            const {access_token: token} = await call(`${api}/auth/token`, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({identifier: process.env.DOCKERHUB_USERNAME, secret: process.env.DOCKERHUB_TOKEN}),
            });
            await call(`${api}/repositories/${repo}/`, {
              method: 'PATCH',
              headers: {Authorization: `Bearer ${token}`, 'Content-Type': 'application/json'},
              body: JSON.stringify({description, full_description: overview}),
            });
            console.log(`Updated the ${repo} page from DOCKERHUB.md`);
          })().catch(error => {
            console.log(`::warning::The Docker Hub page was not updated: ${error.message}`);
            process.exitCode = 1;
          });
          NODE
