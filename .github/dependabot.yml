version: 2
updates:
  # Every action update in one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # ts/ is the npm package. One pull request for minor and patch updates, one for major ones.
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-major:
        patterns: ['*']
        update-types: [major]
    ignore:
      # The types follow the Node the project runs on (24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
