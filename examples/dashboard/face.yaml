# Dashboard -- a dense, multi-row face.
#
# A worked example of the techniques a complex design needs, modelled on the
# reference face in `garmin-watchface-protomolecule`: stacked rows separated by
# hairlines, a two-tone clock, values whose colour depends on their own state,
# icon-and-number clusters, and progress arcs hugging the bezel.
#
# Build it:  wfb build examples/dashboard/face.yaml
#
# ---------------------------------------------------------------------------
# Two things to notice about how this is written.
#
# **Rows are positioned from the top, not the centre.** `anchor: top` with a `%`
# offset reads as "this far down the screen", which is how a row-based design is
# actually designed, and it matches the fractions the reference measured off its
# own rendering. Percentages resolve against the parent box, so a row at
# `dy: 6.6%` sits 6.6% of the screen height below the top edge on every device.
#
# **The separators are drawn in polar coordinates.** Each hairline is a chord of
# a circle just inside the bezel, so both ends are placed by angle and radius
# rather than by x and y -- which is what keeps them touching the rim on a
# 260 px and a 280 px screen alike.
#
# What the reference has and this does not: a weather row with real readings,
# a Body Battery history graph, and a daylight arc. Weather's *condition*
# icon is real now (`icon_for: weather.condition`, row 2 below); its
# temperature, precipitation chance and high/low still need data sources the
# format does not expose yet, and Body Battery and the daylight arc are the
# same story -- see docs/limitations.md. The rows below use real sources so
# the example builds and runs; swap the remaining placeholders out as the
# catalogue grows.
#
# yaml-language-server: $schema=../../schema/wfb-face-1.schema.json

format: 1

face:
  id: c47a1f36-8b25-4e09-a3d7-5f81904bc2e6
  name: Dashboard
  version: 1.0.0

targets: [fenix8solar47mm, fenix8solar51mm, fr955, fr255, fenix6]

antialias: true


fonts:
  clock:
    source: assets/OpenSans-Regular.ttf
    # Rasterised at this many pixels on the smallest target and scaled up for
    # the 280x280 fenix 8 Solar 51 mm, so one declaration is right on both.
    size: 90
    # 'glyphs' is omitted on purpose: the compiler derives the set from every
    # format spec and literal this design can render, so the sheet carries the
    # handful of digits the clock actually draws rather than a character set.
  test:
    source: assets/ChivoMono-Bold.ttf
    # source: assets/SairaStencil-SemiBold.ttf
    size: 70%r


palette:
  # old directly used
  bg: { value: "#000000", label: "none" }
  fg: { value: "#FFFFFF", label: "none" }
  dim: { value: "#AAAAAA", label: "none" }
  dark: { value: "#555555", label: "none" }

  # date: { value: "#00FF00", label: "none" }
  # separator: { value: "#555555", label: "none" }
  dnd_on: { value: "#FF0000", label: "none" }
  # alarm_on: { value: "#FFFF00", label: "none" }
  notify_on: { value: "#FFAA00", label: "none" }
  notify_text: { value: "#000000", label: "none" }
  # arc_steps: { value: "#00FF00", label: "none" }
  # arc_battery: { value: "#00FFFF", label: "none" }
  # arc_move: { value: "#FFFF00", label: "none" }
  # track: { value: "#555555", label: "none" }

  # Primary Neutrals:
  white: { value: "#FFFFFF", label: "White" }
  black: { value: "#000000", label: "Black" }
  light_gray: { value: "#AAAAAA", label: "Light Gray" }
  dark_gray: { value: "#555555", label: "Dark Gray" }
  # High-Visibility Accents (100% Saturation):
  yellow: { value: "#FFFF00", label: "Yellow" }
  cyan: { value: "#00FFFF", label: "Cyan" }
  green: { value: "#00FF00", label: "Green" }
  red: { value: "#FF0000", label: "Red" }
  orange: { value: "#FF5500", label: "Orange" }
  # 
  amber: { value: "#FFAA00", label: "Amber" }
  magenta: { value: "#FF00FF", label: "Magenta" }
  sky_blue: { value: "#00AAFF", label: "Sky Blue" }
  lime_green: { value: "#AAFF00", label: "Lime Green" }
  light_blue: { value: "#55FFFF", label: "Light Blue" }
  #avoid
  dark_blue: { value: "#0000FF", label: "Dark Blue" }
  # have poor reflectivity. They turn into brownish-gray smudges on MIP.
  dark_olive: { value: "#555500", label: "Dark Olive" }
  maroon: { value: "#550000", label: "Maroon" }
  dark_green: { value: "#005500", label: "Dark Green" }

color_scheme:
  dark:
    label: "Dark"
    colors:
      bg: palette.black
      fg: palette.white
      dim: palette.light_gray
      dark: palette.dark_gray
      alarm: palette.yellow
  light:
    label: "Light"
    colors:
      bg: palette.white
      fg: palette.black
      dim: palette.dark_gray
      dark: palette.light_gray
      alarm: palette.amber

config:
  accent_color:
    default: palette.red
    choices: # the editor's own full colour picker
      - palette.red
      - palette.cyan
      - palette.lime_green
      - palette.orange
      - palette.magenta
      - palette.amber
  data_color:
    default: palette.lime_green              # a palette reference, or a literal hex
    choices:                           # or an explicit list
      - palette.sky_blue                   # a bare palette reference ...
      - palette.amber
      - palette.light_blue
      - palette.orange
      - palette.lime_green
  colors:
    default: color_scheme.dark          # must be one of choices:
    choices:
      - color_scheme.dark
      - color_scheme.light

static:
  background:
    type: shape
    shape: rectangle
    at: {anchor: center}
    size: {width: 100%, height: 100%}
    color: config.colors.bg

  # A separator is a chord of a circle just inside the bezel. Both ends are
  # polar, so the line reaches the rim on any screen size.
  sep_1:
    type: shape
    shape: line
    at: {anchor: top, dy: 13%, dx: 25% }
    to: {anchor: top, dy: 13%, dx: -25% }
    thickness: 1px
    color: config.colors.dark
    lint:
      allow: [contrast]
      reason: "a hairline rule is meant to be barely there; full contrast
        would make the separators compete with the data"

  sep_2:
    type: shape
    shape: line
    at: {anchor: top, dy: 23%, dx: 36% }
    to: {anchor: top, dy: 23%, dx: -36% }
    thickness: 1px
    color: config.colors.dark
    lint:
      allow: [contrast]
      reason: "a hairline rule is meant to be barely there; full contrast
        would make the separators compete with the data"

  sep_3:
    type: shape
    shape: line
    at: {anchor: top, dy: 36%, dx: 44% }
    to: {anchor: top, dy: 36%, dx: -44% }
    thickness: 1px
    color: config.colors.dark
    lint:
      allow: [contrast]
      reason: "a hairline rule is meant to be barely there; full contrast
        would make the separators compete with the data"

  sep_4:
    type: shape
    shape: line
    at: {anchor: bottom, dy: -32%, dx:  43% }
    to: {anchor: bottom, dy: -32%, dx: -43% }
    thickness: 1px
    color: config.colors.dark
    lint:
      allow: [contrast]
      reason: "a hairline rule is meant to be barely there; full contrast
        would make the separators compete with the data"

  sep_5:
    type: shape
    shape: line
    at: {anchor: bottom, dy: -20%, dx: 32% }
    to: {anchor: bottom, dy: -20%, dx: -32% }
    thickness: 1px
    color: config.colors.dark
    lint:
      allow: [contrast]
      reason: "a hairline rule is meant to be barely there; full contrast
        would make the separators compete with the data"



elements:

  # -- row 1: the date -------------------------------------------------------
  date:
    type: text
    value: date.today
    format: "{:%a %e %b}"       # "Thu 3 Sep" -- %a and %b come back localised
    font: FONT_TINY
    at: {anchor: top, dy: 8%}
    color: config.data_color

  # -- SEP_1 --

  # -- row 2: a secondary data row ------------------------------------------
  # The reference's row is temperature-percent-condition-high-low; only the
  # condition icon is real here (weather.condition, resolved on-device
  # through WfbWeather.mc -- see docs/format.md's `icon_for` section), so this
  # row pairs it with three other real readings rather than leaving the rest
  # of the row a placeholder. Every value still carries an icon or a unit, the
  # way the reference's row does -- a bare number with nothing to say what it
  # is reads as a placeholder, not as data.
  # Spacing below is sized against a *realistic* ceiling for each value (three
  # digits of heart rate, four of daily calories), not the catalogue's worst-
  # case digit count -- fitting five icon-and-number clusters against a 99999
  # kcal reading would crush the row to be unreadable for every plausible one.
  # Element overlap is not a build-time check (docs/limitations.md), so this
  # is a judgement call made once, here, rather than a gap left implicit.
  hr_icon:
    type: icon
    # icon: heart
    glyph: 'U+F21E'
    size: 11%r
    at: {anchor: top, dx: -28%, dy: 18%}
    color: config.colors.dim

  hr_value:
    type: text
    value: heart_rate.current
    format: "{:d}"
    font: FONT_XTINY
    at: {anchor: top, dx: -24%, dy: 18%}
    align: left
    color: config.colors.dim
    when_absent: placeholder
    placeholder: "--"

  calories_icon:
    type: icon
    icon: flame
    size: 11%r
    at: {anchor: top, dx: -8%, dy: 18%}
    color: config.colors.dim

  calories_value:
    type: text
    value: "activity.calories / 10000.0"
    format: "{:.1f}k"
    font: FONT_XTINY
    at: {anchor: top, dx: -4%, dy: 18%}
    align: left
    color: config.colors.dim
    when_absent: placeholder
    placeholder: "--"

  # No icon for distance -- a unit suffix is enough on its own, the same way
  # the reference's temperature readings need only a "°" to be unambiguous.
  distance_value:
    type: text
    value: "activity.distance / 100000.0"   # centimetres -> kilometres
    format: "{:.1f}km"
    font: FONT_XTINY
    at: {anchor: top, dx: 32%, dy: 18%}
    align: right
    color: config.colors.dim
    when_absent: placeholder
    placeholder: "--"

  # -- SEP_2


  # -- row 3: weather -------------------------------------

  # Ordered outer-to-inner-to-outer as now / high / [icon] / low / precip
  # rather than the reference's strict left-to-right reading order: the two
  # wider "H:"/"L:" labels flank the icon (its own narrow footprint leaves
  # them the most room), and the two narrower readings take the outer slots
  # a wide label could not reach without crossing the bezel curve.
  weather_now:
    type: text
    value: weather.feels_like_temperature
    format: "{:d}°"
    font: FONT_XTINY
    at: {anchor: top, dy: 30%, dx: -32%}
    color: config.colors.dim
    when_absent: placeholder
    placeholder: "--°"

  precipitation:
    type: text
    value: weather.precipitation_chance_today
    format: "{:d}%"
    font: FONT_XTINY
    at: {anchor: top, dy: 30%, dx: -15%}
    color: config.colors.dim
    when_absent: placeholder
    placeholder: "--%"

  weather_conditions_today:
    type: icon
    icon_for: weather.condition_today
    size: 22%r
    at: {anchor: top, dy: 30%}
    color: config.colors.fg
    # color: palette.dim

  weather_today_high:
    type: text
    value: weather.high_temperature_today
    format: "{:d}°"
    font: FONT_XTINY
    at: {anchor: top, dy: 30%, dx: 15%}
    color: config.colors.dim
    when_absent: placeholder
    placeholder: "--°"

  weather_today_low:
    type: text
    value: weather.low_temperature_today
    format: "{:d}°"
    font: FONT_XTINY
    at: {anchor: top, dy: 30%, dx: 32%}
    color: config.colors.dim
    when_absent: placeholder
    placeholder: "--°"

  # -- SEP_3

  # -- row center: the clock, in two colours -------------------------------------
  # Hours and minutes are separate elements so each can take its own colour --
  # a single text element draws in exactly one colour, because a bitmap font
  # carries one channel.
  #
  # FONT_NUMBER_MEDIUM rather than FONT_NUMBER_HOT: at 99px the larger face
  # leaves no room for five rows and four rules on a 260px screen. A face that
  # wants a clock that dominates the dial declares a custom font cut to size --
  # see `fonts:` in docs/format.md -- which is how the reference does it.
  hours:
    type: text
    value: time.hour
    format: "{:02d}"
    font: font.test
    at: {anchor: center, dx: -1%, dy: 0.8%}
    align: right
    color: config.colors.fg

  minutes:
    type: text
    value: time.minute
    format: "{:02d}"
    font: font.test
    at: {anchor: center, dx: 1%, dy: 0.8%}
    align: left
    color: config.accent_color

  # -- SEP_4

  # -- row 4: status ---------------------------------------------------------
  # Two named icons -- not the heart/flame from row 2 pressed into service for
  # something they do not mean. A heart icon next to "do not disturb" reads as
  # a heart-rate alert; the two states need their own shapes to be legible at
  # all, which is why `dnd` and `alarm` exist in the icon catalogue.
  #
  # Both take their colour from an expression, so the on/off state is visible
  # without a second element: the compiler folds this into a Monkey C ternary
  # over the value it has already read.
  floors_value:
    type: text
    value: activity.floors_climbed
    format: "{:d}fl"
    font: FONT_XTINY
    at: {anchor: top, dx: -25%, dy: 74%}
    color: config.colors.dim
    when_absent: placeholder
    placeholder: "--"

  dnd_icon:
    type: icon
    icon: dnd
    size: 14%r
    at: {anchor: top, dx: -12%, dy: 74%}
    color: "device.do_not_disturb ? palette.dnd_on : config.colors.dark"

  alarm_icon:
    type: icon
    icon: alarm
    size: 14%r
    at: {anchor: top, dy: 74%}
    color: "device.alarm_count > 0 ? config.colors.alarm : config.colors.dark"

  steps_value:
    type: text
    value: "activity.steps / 1000.0"
    format: "{:.1f}k"           # always one decimal, so the width holds still
    font: FONT_XTINY
    at: {anchor: top, dx: 25%, dy: 74%}
    color: palette.dim
    when_absent: placeholder
    placeholder: "--"

  # -- SEP_5

  # -- row 5: battery and notifications -------------------------------------
  # The reference grows this badge to fill the whole gap between the
  # separator above and the arc below, calling it out in a comment as "the
  # biggest thing on the row" -- a notification is the one thing here worth
  # noticing without reading. Sized to match: a badge drawn at the same
  # small size as the DND/alarm icons above reads as a smudge, not a bubble.
  #
  # The badge body sits centred on the row, but its speech-bubble tail hangs
  # below that centre -- so the text baseline for the whole row (the count,
  # and the two flanking readouts, so all three line up) sits a little above
  # the row's nominal position, on the badge body's own centre line.
  battery_days:
    type: text
    value: system.battery_in_days
    format: "{:.0f}d"
    font: FONT_XTINY
    at: {anchor: top, dx: -15%, dy: 88%}
    color: config.colors.dim

  # A speech-bubble badge, not a bare circle -- a circle with a number in it
  # reads as a clock face or a button, not as "you have notifications". Both
  # the bubble and the count take their colour from the same condition, so an
  # idle badge shows an empty grey bubble rather than a stray "0".
  # notification_badge_static:
  #   type: icon
  #   icon: notification
  #   size: 25%r
  #   at: {anchor: top, dy: 90%}
  #   color: palette.off
  #   static: true

  notification_badge:
    type: icon
    icon: notification
    size: 25%r
    at: {anchor: top, dy: 90%}
    # visible: device.notification_count > 0
    color: "device.notification_count > 0 ? palette.notify_on : config.colors.dark"
    # color: palette.notify_on
    antialias: false

  notification_count:
    type: text
    value: device.notification_count
    format: "{:d}"
    font: FONT_TINY
    at: {anchor: top, dy: 88%}
    visible: device.notification_count > 0
    color: palette.notify_text
    # color: "device.notification_count > 0 ? palette.notify_text : palette.dark"

  battery_percent:
    type: text
    value: system.battery
    format: "{:.0f}%"
    font: FONT_XTINY
    at: {anchor: top, dx: 15%, dy: 88%}
    color: config.colors.dim

  # -- the arcs --------------------------------------------------------------
  # Three short arcs along the bottom rim. Each is a stroked ring: there is no
  # filled-sector primitive on this platform, so `thickness` is a pen width.
  # `track_color` draws the full length in grey first, so a partial fill can be
  # read against how long the track is.
  #
  # Angles are clockwise from 12 o'clock, so 180deg is the bottom of the screen.
  arc_steps:
    type: progress
    style: arc
    value: activity.steps
    max: activity.step_goal
    at: {anchor: center}
    radius: 98%r
    thickness: 4%r
    start_angle: 212deg         # lower left, growing anticlockwise towards 9 o'clock
    sweep: 32deg
    color: config.data_color
    track_color: config.colors.dark
    when_absent: hide

  arc_battery_right:
    type: progress
    style: arc
    value: system.battery
    max: 100
    at: {anchor: center}
    radius: 98%r
    thickness: 4%r
    start_angle: 180deg         # just left of 6 o'clock, growing clockwise
    sweep: -28deg
    color: config.data_color
    track_color: config.colors.dark

  arc_battery_left:
    type: progress
    style: arc
    value: system.battery
    max: 100
    at: {anchor: center}
    radius: 98%r
    thickness: 4%r
    start_angle: 180deg         # just left of 6 o'clock, growing clockwise
    sweep: 28deg
    color: config.data_color
    track_color: config.colors.dark

  arc_move:
    type: progress
    style: arc
    value: activity.move_bar_level
    max: 5
    at: {anchor: center}
    radius: 98%r
    thickness: 4%r
    start_angle: 148deg         # lower right, growing anticlockwise towards 3 o'clock
    sweep: -32deg
    color: config.data_color
    track_color: config.colors.dark
    when_absent: hide
