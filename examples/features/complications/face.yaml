# Demonstrates the surface added when the refresh-tier concept was deleted
# and Complications became a full 42-type data-source namespace: two
# `complication.*` bindings, and `on_hold: auto` resolving a launch target
# from an element's own value.
#
# Build it with:  ./wfb build examples/features/complications/face.yaml
#
# `complication.*` is always read through Toybox.Complications; every other
# path here (`heart_rate.current`, `activity.*`, `system.battery`) is always
# a direct API read -- see docs/guide/data.md's "The complication.* namespace"
# section for when to prefer one over the other. Both `complication.*`
# sources below (body_battery, solar_input) have no direct-read alternative
# at all, which is exactly the case the namespace exists for.
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json
format: 2

face:
  id: 2e397ee6-193f-4157-accf-013e47ada318
  name: Feature Complications
  version: 1.0.0

build:
  targets:
    - fenix8solar47mm
    - fenix8solar51mm
    - fr955

# Every colour is one the 64-colour MIP panel can show without dithering:
# each channel is 0x00, 0x55, 0xAA or 0xFF.
resources:
  palette:
    bg: "#000000"
    fg: "#FFFFFF"
    dim: "#555555"
    accent: "#FF5500"

elements:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  clock:
    type: text
    text: "{time.clock:%H:%M}"
    font: FONT_NUMBER_MEDIUM
    at: { anchor: center, dy: -22% }
    color: color.fg

  # -- heart rate: a direct read, with on_hold: auto ------------------------
  # 'heart_rate.current' has a conventional launch target (`heart_rate`,
  # `Source.launch_complication` in `ts/src/catalog.ts`) -- 'auto' below resolves it, so
  # a hold on this text opens the heart-rate glance without naming it by hand.
  hr_icon:
    type: icon
    icon: heart
    at: { anchor: center, dx: -26%, dy: -1% }
    size: 12%r
    color: color.accent

  hr_value:
    type: text
    text: "{complication.heart_rate:d}"
    font: FONT_XTINY
    at: { anchor: center, dx: -26%, dy: 10% }
    color: color.fg
    absent: "--"
    on_hold: auto              # resolves to 'heart_rate'

  # -- body battery: only reachable through Complications --------------------
  # Toybox.SensorHistory is the only other route to Body Battery, and it is a
  # permission a Watch Face may not declare at all
  # (Core_Topics/Manifest_and_Permissions.html's table has a blank Watch Face
  # column for it) -- so 'complication.body_battery' is not a convenience
  # here, it is the only way in.
  body_battery_icon:
    type: icon
    # icon: battery
    icon: "U+F120F"
    # icon: "U+F1211"
    at: { anchor: center, dy: -1% }
    size: 12%r
    color: color.accent

  body_battery_value:
    type: text
    text: "{complication.body_battery:d}"
    font: FONT_XTINY
    at: { anchor: center, dy: 10% }
    color: color.fg
    absent: "--"

  # -- solar input: also only reachable through Complications -----------------
  solar_icon:
    type: icon
    icon: weather_sunny
    at: { anchor: center, dx: 26%, dy: -1% }
    size: 12%r
    color: color.accent

  solar_value:
    type: text
    text: "{complication.solar_input:.0f}%"
    font: FONT_XTINY
    at: { anchor: center, dx: 26%, dy: 10% }
    color: color.fg
    absent: "--"

  # -- steps: a direct read, with an explicit (not 'auto') launch target -----
  steps_icon:
    type: icon
    icon: steps
    at: { anchor: center, dy: 26% }
    size: 12%r
    color: color.accent

  steps_value:
    type: text
    text: "{activity.steps:d}"
    font: FONT_XTINY
    at: { anchor: center, dy: 37% }
    color: color.fg
    absent: "--"
    on_hold: steps             # named explicitly, for contrast with 'auto'
