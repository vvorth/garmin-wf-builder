# `align:` (docs/guide/placement.md "Placement: `at:` and `align:`"):
# every accepting kind, with non-default alignment on both axes,
# on one legible analog face rather than a test dump.
#
# The face is a classic hour/minute dial with a ring of tick marks and hour
# numerals, and four small readouts at the diagonals (NE/SE/SW/NW) -- exactly
# where a real Garmin face puts its complications. Each readout's box is
# anchored at its diagonal point and aligned to grow *away* from the centre,
# towards the bezel, rather than being centred on the point (the default)
# -- which is what makes the four diagonals cover
# all four corner alignments for free:
#
#   NE (up-right):   align: bottom_left   -- grows right + up
#   SE (down-right):  align: top_left      -- grows right + down
#   SW (down-left):   align: top_right     -- grows left + down
#   NW (up-left):     align: bottom_right  -- grows left + up
#
# What sits in each diagonal, and which accepting kind it exercises:
#
#   * NE: `data` element (steps, re-pointable on the wrist) behind a
#     rounded `rectangle` card (`corner_radius:`), each with a small margin around its content.
#   * SE: a `group` (heart icon + `heart_rate.current`) behind an `ellipse`
#     card -- the group carries the alignment, so its children stay centred
#     inside it.
#   * SW: a `group` again, this time sized to a `circle` card's own
#     *inscribed* square (side = radius x root 2) rather than its bounding
#     square -- so the `graph` (7-day steps bars) inside it can align to a
#     corner of that square, non-default on both axes, and still land
#     entirely inside the circle. Aligning a box-shaped reading straight at
#     a circle's own bounding-square corner (its first draft) put the ink
#     outside the disc; this is the fix, not a special case.
#   * NW: `text` (today's date) behind a plain `rectangle` card -- the one
#     `align: bottom` on a `text` element this face has.
#
# A small decorative `circle` (`crown_dot`) above 12 o'clock is the fifth
# shape's own alignment demo, with no content to contain -- a `circle` card
# only makes sense with its content centred on the circle, so a *bare* dot
# is what a corner-aligned circle looks like once it is not asked to hold
# anything.
#
# Below the dial, in their own clear band close to 6 o'clock -- separate
# from the four diagonal readouts, not tucked behind them -- a mirrored
# pair: a `gauge` bar (steps-goal) aligned left/bottom and a `gauge`
# arc (battery) aligned right/bottom, growing towards each other, with a
# `battery` `icon` sharing the arc's own anchor and alignment, nested inside
# its ring. A small `type: arc` accent above the dial uses the last
# unclaimed shape. `type: rectangle` (square and rounded)/`ellipse`/
# `circle`/`arc` are thereby all exercised with non-default alignment;
# `type: polygon`/`line` are not used here at all (see `examples/features/shapes/`
# for those two, which refuse `align:` outright).
#
# The dial ring itself is a `pattern`: a radial `rectangle` tick + `circle`
# bead (both aligned, resolved in the part's own frame so the alignment turns
# with the copy) and a radial `text` numeral part (`align: bottom`,
# anchor turns, glyphs stay upright). The hands (`hand_sets:`) are a plain
# hour/minute set; the minute hand's `rectangle` part is
# `align: bottom` with `at: {dy: 0}`, so it starts exactly on the
# axis and extends to the tip -- the doc's own "saves `dy: -length/2`"
# example. A `type: hands`/`type: pattern` element itself refuses
# `align:` outright (see `examples/features/analog/`, `examples/features/patterns/` for that
# refusal); this face does not repeat it.
#
# Small guide dots at the four diagonal `at:` points show where each
# readout's box is anchored before alignment pushes it outward.
#
# `venusq2` (320x360, AMOLED) is a fourth target: the one example with a
# rectangular screen, and the reason `main_hands` carries `aod: show` -- an
# AMOLED target needs an always-on frame, and the hands are this face's.
# The three MIP targets never draw it.
#
# What is verified: this design compiles warning-free through the real
# `monkeyc` on all four targets, and `wfb preview` renders the resolved
# geometry the header describes. What is NOT verified anywhere in this
# project: what any of it looks like on a panel, or that today's date and
# steps bars move correctly at midnight -- there is no simulator and no
# watch in this container.
#
# Build it with:     ./wfb.py build examples/features/align/face.yaml
# Preview it with:   ./wfb.py preview examples/features/align/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: a1b2c3d4-e5f6-4789-a123-456789abcdef
  name: Feature Align
  version: 1.0.0

build:
  targets:
    - fenix8solar47mm
    - fenix8solar51mm
    - fr955
    - venusq2

# Every colour is one the 64-colour MIP panel shows without dithering: each
# channel is 0x00, 0x55, 0xAA or 0xFF.
resources:
  palette:
    bg: "#000000"
    fg: "#FFFFFF"
    dim: "#AAAAAA"
    card: "#5555AA"
    accent: "#00AAFF"     # steps
    heart: "#FF0055"      # heart rate
    gold: "#FFAA00"       # battery

  hand_sets:
    main:
      hour:
        color: color.fg
        parts:
          - type: polygon                # pointing at 12; origin = the axis
            points:
              - { dx: -3%r, dy: 6%r }     # a short tail behind the axis
              - { dx: -2%r, dy: -38%r }
              - { dy: -44%r }             # the tip, straight up
              - { dx: 2%r, dy: -38%r }
              - { dx: 3%r, dy: 6%r }
      minute:
        color: color.fg
        parts:
          # `at: {dy: 0}` + `align: bottom`: the box's bottom edge
          # sits on the axis, so the rectangle runs from the axis to the tip
          # without computing `dy: -length/2` by hand (docs/guide/placement.md
          # "Analog hands").
          - type: rectangle
            at: { dy: 0 }
            align: bottom
            size: { width: 3%r, height: 60%r }
          - type: circle                  # the hub, on the axis by default
            radius: 4%r
            color: color.accent

config:
  slots:
    top:
      default: steps
      choices:
        - steps
        - heart_rate

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  # The tick ring: a radial `rectangle` part (top-aligned, so its top edge
  # sits at the anchor and it extends inward) and a `circle` bead (aligned
  # left/top, shifting its centre off the anchor). Both resolved in the
  # part's own frame, so the alignment shift turns with each copy.
  hour_ticks:
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 12
    color: color.dim
    parts:
      - type: rectangle
        at: { dy: -94%r }
        align: top
        size: { width: 2.5%r, height: 8%r }
      - type: circle
        at: { dy: -84%r }
        align: top_left
        radius: 1.2%r

  # Hour numerals, one radial `type: text` part: `align: bottom`
  # puts each numeral's bottom edge on its turned anchor (the glyphs stay
  # upright; only the anchor turns -- docs/guide/patterns.md "Text parts").
  hour_numerals:
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 12
    color: color.fg
    parts:
      - type: text
        # copy 0 -> "12", copy 1 -> "1", ... copy 11 -> "11" (the safe
        # spelling for Monkey C's unverified negative-`%` behaviour).
        text: "{(copy + 11) % 12 + 1}"
        font: FONT_XTINY
        at: { dy: -74%r }
        align: bottom

  # Three diagonal cards (NE, SE, NW) -- SW's own card is inside a `group`,
  # below, for the reason the header gives. Each card is comfortably bigger
  # than the content it sits behind, so the content keeps a small, even
  # margin off the card's own edge.
  ne_card:
    type: rectangle
    at: { anchor: center, angle: 45deg, radius: 27%r }
    size: { width: 38%r, height: 15%r }
    corner_radius: 3px
    color: color.card
    align: bottom_left

  se_card:
    type: ellipse
    at: { anchor: center, angle: 135deg, radius: 27%r }
    size: { width: 32%r, height: 15%r }
    color: color.card
    align: top_left

  nw_card:
    type: rectangle
    at: { anchor: center, angle: 315deg, radius: 27%r }
    size: { width: 38%r, height: 15%r }
    color: color.card
    align: bottom_right

  # A small decorative accent above the dial -- the one `type: arc` this
  # face draws, aligned on both axes like every other accepting shape.
  top_accent:
    type: arc
    at: { anchor: center, angle: 0deg, radius: 30%r }
    radius: 6%r
    thickness: 2px
    start_angle: 340deg
    sweep: 40deg
    color: color.dim
    align: bottom_left

  # The fifth shape's own alignment demo (see the header): a bare dot, with
  # no content to contain, so corner alignment needs no inscribed-square
  # trick -- just a small mark above 12 o'clock.
  crown_dot:
    type: circle
    at: { anchor: center, angle: 0deg, radius: 22%r }
    radius: 2.5%r
    color: color.dim
    align: top_right

  # Guide dots at the three plain diagonal `at:` points (SW's is inside its
  # group, below) -- default-aligned, plain `type: circle` markers showing
  # where each card's box is anchored before `align:`
  # push it outward.
  ne_dot: { type: circle, at: { anchor: center, angle: 45deg, radius: 27%r }, radius: 1px, color: color.dim }
  se_dot: { type: circle, at: { anchor: center, angle: 135deg, radius: 27%r }, radius: 1px, color: color.dim }
  nw_dot: { type: circle, at: { anchor: center, angle: 315deg, radius: 27%r }, radius: 1px, color: color.dim }

elements:
  main_hands:
    type: hands
    set: main
    at: { anchor: center }
    aod: show

  # NE: `data` element, re-pointable on the wrist between steps and
  # heart rate -- on `fr955`, from the generated settings menu
  # (`examples/features/slots/face.yaml`).
  steps_slot:
    type: data
    slot: top
    at: { anchor: center, angle: 45deg, radius: 27%r }
    font: FONT_XTINY
    icon: { size: 7%r, position: right, gap: 2px, color: color.accent }
    color: color.fg
    absent: "--"
    align: bottom_left

  # SE: a `group` carries the alignment; its icon and text stay centred on
  # their own positions inside the group's box.
  heart_group:
    type: group
    at: { anchor: center, angle: 135deg, radius: 27%r }
    size: { width: 22%r, height: 10%r }
    align: top_left
    children:
      heart_icon:
        type: icon
        icon: heart
        size: 8%r
        at: { anchor: left }
        color: color.heart
      heart_value:
        type: text
        text: "{heart_rate.current:d}"
        font: FONT_XTINY
        at: { anchor: right }
        align: right
        color: color.heart
        absent: hide

  # SW: a `group`, sized to the `circle` card's own bounding square (2 x
  # radius) so the *group's* alignment reads the same "away from centre" way
  # the other three diagonals do. Inside it, the card sits centred on the
  # group's own anchor (so the card's centre and the graph's anchor
  # coincide), and the `graph` -- aligned right/bottom, non-default on both
  # axes -- is sized to fit inside the card's *inscribed* square (side =
  # radius x root 2 = ~19.8%r for a 14%r radius), so its farthest corner
  # (root(11^2+6^2) = ~12.5%r from the centre) stays inside the 14%r circle
  # with margin, instead of the bounding-square corner that put ink outside
  # the disc.
  steps_group:
    type: group
    at: { anchor: center, angle: 225deg, radius: 27%r }
    size: { width: 28%r, height: 28%r }
    align: top_right
    children:
      steps_card:
        type: circle
        radius: 14%r
        at: { anchor: center }
        color: color.card
      steps_graph:
        type: graph
        at: { anchor: center }
        size: { width: 11%r, height: 6%r }
        align: bottom_right
        series: steps
        range: 7d
        style: bars
        bar_width: 2px
        color: color.accent
        min: 0
        max: auto

  # NW: today's date -- the one `align: bottom` on a `text`
  # element this face has.
  date_text:
    type: text
    text: "{date.today:%a %e}"
    font: FONT_XTINY
    at: { anchor: center, angle: 315deg, radius: 27%r }
    align: bottom_right
    color: color.fg

  # A mirrored pair close to 6 o'clock, in its own clear band: a narrow
  # angular spread (10deg either side of straight down) keeps both well
  # clear of the SE/SW diagonal readouts (whose own reach stops at ~62-67%r,
  # off to the sides) rather than tucked behind them. A steps-goal bar
  # aligned left/bottom and a battery gauge aligned right/bottom grow
  # towards each other.
  steps_bar:
    type: gauge
    style: bar
    at: { anchor: center, angle: 173deg, radius: 44%r }
    size: { width: 12%r, height: 4%r }
    value: activity.steps
    max: activity.step_goal
    color: color.accent
    track_color: color.dim
    align: bottom_left
    absent: hide

  battery_arc:
    type: gauge
    style: arc
    at: { anchor: center, angle: 187deg, radius: 46%r }
    radius: 6%r
    thickness: 3px
    start_angle: 20deg
    sweep: 320deg
    value: system.battery
    max: 100
    color: color.gold
    track_color: color.dim
    align: bottom_right

  # Nested inside the arc's own ring: same anchor, same alignment, so the
  # icon sits inside the gauge instead of needing a separate clear spot.
  battery_icon:
    type: icon
    icon: battery
    size: 6%r
    at: { anchor: center, angle: 187deg, radius: 46%r }
    color: color.gold
    align: bottom_right
