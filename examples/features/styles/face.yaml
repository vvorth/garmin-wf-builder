# `layouts:` -- named widget sets the wearer switches between on-device,
# riding the same Styles axis `examples/features/config/face.yaml` already uses for
# colour alone (docs/guide/styles-and-layouts.md). Form A only: a layout is a
# container (`layouts: <name>: {static, elements}`), never an element-level
# membership key.
#
# Three things this design exercises together, none of them shown anywhere
# else in `examples/`:
#
# * **Two layouts, each with its own static *and* dynamic content.** `big`
#   is a plain, oversized digital clock inside a static decorative ring.
#   `compact` is a small clock above a steps gauge arc, whose *track*
#   (the dim full ring underneath) is static -- drawn once -- while the
#   *fill* (`steps_arc`, `type: gauge`) is drawn fresh every frame on top
#   of it, the same "static furniture, dynamic reading" split
#   `tests/fixtures/slice/face.yaml` uses for one ring, done here per layout.
#   Both layouts' own content draws *above* the shared content, in its own
#   layer, by the fixed z rule (`docs/guide/styles-and-layouts.md`) --
#   there is nothing to interleave here, but nothing stops it looking that
#   way either.
# * **Three `config: style:` entries over two layouts and two schemes**:
#   `big_dark`, `big_light` and `compact_dark` -- `big` paired with both
#   schemes, `compact` with only one, which is exactly the "author writes
#   however many entries they want" point (there is no
#   generated layout x scheme product).
# * **A hold target with a layout** (`big_clock`'s `on_hold: heart_rate`) --
#   only reachable while `big` is the active layout, which is what exercises
#   the delegate's guarded hit test through the generated view's own
#   `configLayout()` accessor.
#
# The shared content -- drawn in every layout, underneath both -- is a
# background bound to `color.bg`, a **`data` element** (the
# positive case of the slot rule: a slot may only ever be shared, never
# inside a `layouts:` body, on pain of a build error), and a small date.
#
# `fr955` has no native editor at all (CLAUDE.md constraint 6) -- it offers
# every entry, layouts and colours alike, from the generated settings menu,
# opened from its Watch Face menu (docs/guide/configuration.md).
#
# `compact_clock` also carries `sleep_update: true` -- small enough
# (measured: well under the 25% clip-area threshold) that it costs no
# `partial-update-budget` finding on any target, which is what makes it safe
# to include as the `onPartialUpdate` guard's only worked example so far.
#
# What is verified: this design compiles warning-free, through the real
# `monkeyc`, on all three targets -- the `_configLayout` field, both
# guarded draw sequences (`onUpdate`/`onPartialUpdate`/`renderStatic`), and
# the delegate's guarded `on_hold` all build clean. What is NOT verified
# anywhere in this project: any *behaviour* of the on-device editor itself
# (no simulator in this container, no watch) -- whether switching a style in
# the native editor previews instantly, and whether the touch-and-hold
# region for `big_clock` reads correctly on a real touchscreen, are both
# UNVERIFIED. `wfb preview --style <entry>`/`--all-styles` is what is
# verified: the same resolved geometry the generated code draws from,
# rendered with no simulator.
#
# Build it with:  ./wfb.py build examples/features/styles/face.yaml
# Preview one style with:  ./wfb.py preview examples/features/styles/face.yaml --style compact_dark
# Preview every style with:  ./wfb.py preview examples/features/styles/face.yaml --all-styles
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 565ddf22-b8b4-4182-b70d-813ddb91d268
  name: Feature Styles
  version: 1.0.0

build:
  targets:
    - fenix8solar47mm
    - fenix8solar51mm
    - fr955

# Every colour below -- palette, scheme and config alike -- is one the
# 64-colour MIP panel can show without dithering: each channel is 0x00, 0x55,
# 0xAA or 0xFF.
resources:
  palette:
    black: "#000000"
    white: "#FFFFFF"
    dark_gray: "#555555"
    light_gray: "#AAAAAA"

theme:
  schemes:
    dark:
      label: "Dark"
      colors: { bg: color.black, fg: color.white, track: color.dark_gray }
    light:
      label: "Light"
      colors: { bg: color.white, fg: color.black, track: color.light_gray }

config:
  slots:
    reading:
      default: steps
      choices:
        - steps
        - heart_rate
        - body_battery
  style:
    default: big_dark
    choices:
      big_dark: { label: "Big · Dark", layout: big, scheme: dark }
      big_light: { label: "Big · Light", layout: big, scheme: light }
      compact_dark: { label: "Compact · Dark", layout: compact, scheme: dark }

# Shared: drawn underneath both layouts, in every one of them.
static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

elements:
  date_text:
    type: text
    text: "{date.today:%a %d}"
    font: FONT_XTINY
    at: { anchor: center, dy: -38% }
    color: color.fg
    lint:
      allow: [static-overlap]
      reason: "A decorative ring's bounding box is its full circumscribed
        square, which overstates the thin ink of the ring itself -- this text
        sits well clear of the drawn line on every target"

  reading_slot:
    type: data
    slot: reading
    at: { anchor: center, dy: 38% }
    font: FONT_XTINY
    color: color.fg
    absent: "--"
    lint:
      allow: [static-overlap]
      reason: "The same decorative-ring bounding-box overstatement as
        date_text above"

layouts:
  big:
    static:
      big_ring:
        type: arc
        at: { anchor: center }
        radius: 84%r
        thickness: 4px
        start_angle: 0deg
        sweep: 360deg
        color: color.track

    elements:
      big_clock:
        type: text
        text: "{time.clock:%H:%M}"
        font: FONT_NUMBER_HOT
        at: { anchor: center, dy: -4% }
        color: color.fg
        on_hold: heart_rate

  compact:
    static:
      steps_track:
        type: arc
        at: { anchor: center }
        radius: 90%r
        thickness: 10px
        start_angle: 180deg
        sweep: 340deg
        color: color.track

    elements:
      compact_clock:
        type: text
        text: "{time.clock:%H:%M}"
        font: FONT_MEDIUM
        at: { anchor: center, dy: -20% }
        color: color.fg
        sleep_update: true

      steps_arc:
        type: gauge
        style: arc
        value: activity.steps
        max: activity.step_goal
        at: { anchor: center }
        radius: 90%r
        thickness: 10px
        start_angle: 180deg
        sweep: 340deg
        color: color.fg
        absent: hide

