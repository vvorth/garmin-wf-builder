# `pattern: grid` (docs/guide/patterns.md "Grids"): one template in rows of
# `columns:`, `count:` copies in all.
#
# Copy `i` sits in column `i % columns` and row `i // columns`, offset by
# `step:`'s `dx` per column and `dy` per row from `at:` (copy 0's place).
# Because `count:` is the total, the last row may be partial. What this
# design exercises:
#
# * **A month of dots** (`month`): 31 copies in rows of 7 -- four full
#   weeks and three days -- with today's dot lit through `copy` (the
#   copy's own index, as on every pattern) and the days already gone
#   dimmed.
# * **Text parts on a grid** (`weekdays`): the seven day initials as one
#   `type: text` part, a single row of seven, heading the dots.
# * **`%` part lengths inside a group** (`week`): a framed strip of seven
#   bars, today's lit. A linear (or grid) pattern's parts measure `%`
#   against the box the pattern sits in, here the group's: each bar is 10 %
#   of the strip's width and 60 % of its height, so resizing the group
#   resizes the bars with it. The strip is 98%r wide, so its 1/7 step
#   lines each bar up under a column of dots.
#
# The month always has 31 dots; a shorter month's last days simply never
# light. A per-copy `visible:` could hide them, at the cost of reading the
# month's length -- left out to keep the example small.
#
# Build it with:     ./wfb build examples/features/grid/face.yaml
# Preview it with:   ./wfb preview examples/features/grid/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2
face:
  id: 90db990c-871b-4c5a-9e0c-fa351afc5032
  name: Feature grid
  version: 1.0.0
build:
  targets: [fenix8solar47mm, fenix8solar51mm, fr955]
resources:
  palette:
    bg: "#000000"
    fg: "#FFFFFF"
    past: "#AAAAAA"
    today: "#FFAA00"

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  weekdays:
    type: pattern
    pattern: grid
    at: { anchor: center, dx: -42%r, dy: -30%r }
    count: 7
    columns: 7
    step: { dx: 14%r }
    color: color.past
    parts:
      initial:
        type: text
        text: >-
          {(copy == 0 ? "M" : copy == 1 ? "T" : copy == 2 ? "W" : copy == 3 ? "T" :
          copy == 4 ? "F" : copy == 5 ? "S" : "S")}
        font: FONT_XTINY

elements:
  clock:
    type: text
    text: "{time.clock:%h:%M}"
    font: FONT_NUMBER_MILD
    at: { anchor: center, dy: -58%r }
    color: color.fg

  month:
    type: pattern
    pattern: grid
    at: { anchor: center, dx: -42%r, dy: -12%r }
    count: 31
    columns: 7
    step: { dx: 14%r, dy: 14%r }
    color: "copy == date.day - 1 ? color.today : (copy < date.day - 1 ? color.past : color.fg)"
    parts:
      dot: { type: circle, radius: 4%r }

  week:
    type: group
    at: { anchor: center, dy: 68%r }
    size: { width: 98%r, height: 14%r }
    children:
      frame:
        type: rectangle
        at: { anchor: center }
        size: { width: 100%, height: 100% }
        filled: false
        color: color.past
      bars:
        type: pattern
        pattern: linear
        at: { anchor: left, dx: 7.1429% }   # the middle of the first seventh
        count: 7
        step: { dx: 14.2857% }              # a seventh of the group's width
        # date.weekday is 1 = Sunday .. 7 = Saturday: (weekday + 5) % 7 is Monday = 0
        color: "copy == (date.weekday + 5) % 7 ? color.today : color.past"
        parts:
          bar: { type: rectangle, size: { width: 10%, height: 60% } }
