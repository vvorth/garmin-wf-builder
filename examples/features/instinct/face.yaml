# A semi-octagon face (research 16): the Instinct family's
# 176x176 2-colour MIP panel, with its round subscreen window at the top
# right.
#
# What it exercises:
#
#   * Black and white only. These panels show black and one "on" colour;
#     every other colour is a `palette-mono` warning, because what the
#     firmware does with it is unverified (docs/guide/lints.md). The preview
#     snaps to black and white the same way and says it is guessing.
#   * The visible area. `wfb preview` greys out the octagon's chamfered
#     corners and the opaque ring round the subscreen, both read from the
#     simulator skin, and `safe-area` warns on anything under them. The big
#     clock sits low and left so it clears the ring.
#   * The subscreen window, with `at: { anchor: subscreen }`: the battery
#     gauge and its number are laid out inside the window's own box (62x62
#     at (113, 0) on all four targets, from simulator.json), so the ring's
#     `radius: 39%` is 39% of the window, not of the screen. A target with
#     no window would be a build error, unless the element set
#     `unsupported: hide` (docs/guide/placement.md).
#
# What is verified: this design lints clean and compiles warning-free on
# all four targets, and `wfb preview` renders it. What is not: how it looks
# on a real Instinct -- there is no simulator here, and the user owns none.
#
# Build it with:     ./wfb.py build examples/features/instinct/face.yaml
# Preview it with:   ./wfb.py preview examples/features/instinct/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 5e0f2a7c-9b41-4d6e-8c3a-71d2b8e4f915
  name: Feature Instinct
  version: 1.0.0

build:
  targets:
    - instinct2
    - instinct2x
    - instinct3solar45mm
    - instincte45mm

resources:
  palette:
    bg: "#000000"
    fg: "#FFFFFF"

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

elements:
  # -- the subscreen window: battery, as a ring and a number ----------------
  battery_ring:
    type: gauge
    style: arc
    at: { anchor: subscreen }
    radius: 39%
    thickness: 3px
    start_angle: 0deg
    sweep: 360deg
    value: system.battery
    max: 100
    color: color.fg

  battery_value:
    type: text
    text: "{system.battery:d}"
    font: FONT_XTINY
    at: { anchor: subscreen }
    color: color.fg

  # -- the main face ----------------------------------------------------------
  date:
    type: text
    text: "{date.today:%a %e}"
    font: FONT_SMALL
    at: { anchor: left, dx: 12%, dy: -22% }
    align: left
    color: color.fg

  clock:
    type: text
    text: "{time.clock:%h:%M}"
    font: FONT_NUMBER_MEDIUM
    at: { anchor: center, dy: 4% }
    color: color.fg

  divider:
    type: rectangle
    at: { anchor: center, dy: 24% }
    size: { width: 60%, height: 2px }
    color: color.fg

  steps_icon:
    type: icon
    icon: steps
    size: 9%r
    at: { anchor: center, dx: -30%, dy: 34% }
    color: color.fg

  steps:
    type: text
    text: "{activity.steps:d}"
    font: FONT_TINY
    at: { anchor: center, dx: -24%, dy: 34% }
    align: left
    color: color.fg
    absent: "--"

  heart_icon:
    type: icon
    icon: heart
    size: 9%r
    at: { anchor: center, dx: 10%, dy: 34% }
    color: color.fg

  heart:
    type: text
    text: "{heart_rate.current:d}"
    font: FONT_TINY
    at: { anchor: center, dx: 16%, dy: 34% }
    align: left
    color: color.fg
    absent: "--"
