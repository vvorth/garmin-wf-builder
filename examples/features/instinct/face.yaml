# A semi-octagon face (research 16, plan 20 slice 3): the Instinct family's
# 176x176 2-colour MIP panel, with its round subscreen window at the top
# right.
#
# What it exercises:
#
#   * Black and white only. These panels show black and one "on" colour;
#     every other colour is a `palette-mono` warning, because what the
#     firmware does with it is unverified (docs/guide/lints.md). The preview
#     snaps to black and white the same way and says it is guessing.
#   * The visible area. `wfb preview` greys out the octagon's chamfered
#     corners and the opaque ring round the subscreen, both read from the
#     simulator skin, and `safe-area` warns on anything under them. The big
#     clock sits low and left so it clears the ring.
#   * The subscreen window. It is part of the same framebuffer, a 62x62 box
#     at (113, 0) on all four targets (simulator.json `subscreen.location`),
#     so the battery gauge inside it is placed in px from the top-right
#     corner: its centre is (144, 31). `anchor: subscreen` would say this
#     directly; it is plan 20's D2, not built.
#
# What is verified: this design lints clean and compiles warning-free on
# all four targets, and `wfb preview` renders it. What is not: how it looks
# on a real Instinct -- there is no simulator here, and the user owns none.
#
# Build it with:     ./wfb.py build examples/features/instinct/face.yaml
# Preview it with:   ./wfb.py preview examples/features/instinct/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-1.schema.json

format: 1

face:
  id: 5e0f2a7c-9b41-4d6e-8c3a-71d2b8e4f915
  name: Feature Instinct
  version: 1.0.0

targets:
  - instinct2
  - instinct2x
  - instinct3solar45mm
  - instincte45mm

palette:
  bg: "#000000"
  fg: "#FFFFFF"

static:
  - id: background
    type: shape
    shape: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: palette.bg

elements:
  # -- the subscreen window: battery, as a ring and a number ----------------
  - id: battery_ring
    type: progress
    style: arc
    at: { anchor: top_right, dx: -32px, dy: 31px }
    radius: 24px
    thickness: 3px
    start_angle: 0deg
    sweep: 360deg
    value: system.battery
    max: 100
    color: palette.fg

  - id: battery_value
    type: text
    value: system.battery
    format: "{:d}"
    font: FONT_XTINY
    at: { anchor: top_right, dx: -32px, dy: 31px }
    color: palette.fg

  # -- the main face ----------------------------------------------------------
  - id: date
    type: text
    value: date.today
    format: "{:%a %e}"
    font: FONT_SMALL
    at: { anchor: left, dx: 12%, dy: -22% }
    align: left
    color: palette.fg

  - id: clock
    type: text
    value: time.clock
    format: "{:%h:%M}"
    font: FONT_NUMBER_MEDIUM
    at: { anchor: center, dy: 4% }
    color: palette.fg

  - id: divider
    type: shape
    shape: rectangle
    at: { anchor: center, dy: 24% }
    size: { width: 60%, height: 2px }
    color: palette.fg

  - id: steps_icon
    type: icon
    icon: steps
    size: 9%r
    at: { anchor: center, dx: -30%, dy: 34% }
    color: palette.fg

  - id: steps
    type: text
    value: activity.steps
    format: "{:d}"
    font: FONT_TINY
    at: { anchor: center, dx: -24%, dy: 34% }
    align: left
    color: palette.fg
    when_absent: placeholder
    placeholder: "--"

  - id: heart_icon
    type: icon
    icon: heart
    size: 9%r
    at: { anchor: center, dx: 10%, dy: 34% }
    color: palette.fg

  - id: heart
    type: text
    value: heart_rate.current
    format: "{:d}"
    font: FONT_TINY
    at: { anchor: center, dx: 16%, dy: 34% }
    align: left
    color: palette.fg
    when_absent: placeholder
    placeholder: "--"
