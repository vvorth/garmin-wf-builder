# `config:` -- the colours the wearer can change in the fēnix 8's own
# on-device watch face editor (API 5.1.0), without touching Garmin Connect.
#
# Garmin's editor has exactly one accent-colour axis, one data-colour axis,
# and one Styles axis -- which carries no colour of its own, but is the only
# axis Garmin gives no meaning to at all, so this compiler gives each listed
# `style:` entry a meaning: a declared scheme (`theme: schemes:`), named as
# `scheme:`.
# `config:` accepts exactly those three keys -- `accent_color`, `data_color`
# and `style` -- and nothing else (docs/guide/configuration.md "Configuration" and docs/guide/colors.md "Colour
# schemes", docs/adr/0006-configuration-theming-and-modes.md 1, twice amended;
# "Styles and layouts" for `style:` itself).
#
# `accent_ring` and `background`/`steps_caption` below are deliberately
# inside `static:`, to exercise the part of this feature that is easy to get
# wrong: a static element is painted once into an offscreen buffer, so a
# config colour drawn there has to be re-painted on a settings edit or the
# change would never show -- `background`/`steps_caption` exercise this for a
# scheme role specifically, moving *two* colours together on one
# settings edit, not just one.  `clock` below is an ordinary, non-static
# binding to the data-colour axis, for contrast.
#
# `fr955` has no native editor at all (CLAUDE.md constraint 6: it reports
# ConnectIQ 5.2.0, above the editor's own documented 5.1.0, and still lacks
# it) -- it offers the same axes from the generated settings menu, opened
# from its Watch Face menu (docs/guide/configuration.md).
#
# No behaviour of the editor's own UI is verified anywhere in this project --
# there is no simulator in this container and no watch.  What is verified:
# the design compiles warning-free on all three targets, and what it costs.
#
# Build it with:  ./wfb.py build examples/features/config/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 8f3c6e2a-1d4b-4a7e-9c5f-2b6a7d4e9f10
  name: Feature Config
  version: 1.0.0

build:
  targets:
    - fenix8solar47mm
    - fenix8solar51mm
    - fr955

# Every colour below -- palette, scheme and config alike -- is one the
# 64-colour MIP panel can show without dithering: each channel is 0x00, 0x55,
# 0xAA or 0xFF.  The linter checks all three the same way (`palette-dither`).
resources:
  palette:
    black: "#000000"
    white: "#FFFFFF"

# Two roles, moving together on one Styles pick -- `background` and
# `steps_caption` below are both bound to a role, so switching schemes swaps
# both colours from a single settings edit.
theme:
  schemes:
    dark:
      label: "Dark"
      colors: { bg: color.black, text: color.white }
    light:
      label: "Light"
      colors: { bg: color.white, text: color.black }

config:
  accent_color:
    default: "#FF5500"
    choices: any                        # the editor's own full colour picker
  data_color:
    default: "#FFFFFF"
    choices:                            # or an explicit, labelled list
      - { color: "#FFFFFF", label: "White" }
      - { color: "#00FFFF", label: "Aqua" }
      - { color: "#FFAA00", label: "Amber" }
  style:
    default: dark                       # must be one of choices:
    choices:
      dark: { scheme: dark }
      light: { scheme: light }

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  # The static half of the demonstration: painted once into the offscreen
  # buffer in onLayout, and re-painted by `applyConfig` whenever the wearer
  # changes the accent colour (or picks a different style -- see
  # `background`/`steps_caption` above/below, both roles of the same
  # scheme), so the buffer never shows a stale value.
  accent_ring:
    type: arc
    at: { anchor: center }
    radius: 90%r
    thickness: 10px
    start_angle: 0deg
    sweep: 360deg
    color: color.accent

  steps_caption:
    type: text
    text: "STEPS"
    font: FONT_XTINY
    at: { anchor: center, dy: 24% }
    color: color.text

# The dynamic half: an ordinary binding to the other axis, drawn fresh every
# frame like any other element -- no static buffer involved.
elements:
  clock:
    type: text
    text: "{time.clock:%h:%M}"
    font: FONT_NUMBER_HOT
    at: { anchor: center, dy: -4% }
    color: color.data

  steps:
    type: text
    text: "{activity.steps:d}"
    font: FONT_SMALL
    at: { anchor: center, dy: 31% }
    color: color.white
    absent: "0"
