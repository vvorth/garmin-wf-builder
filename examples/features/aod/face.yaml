# Always-on display (docs/guide/always-on-display.md, plan 14 slice 1):
# `aod:` as overrides on the one design, replacing `modes: [always_on]`
# outright (D3) -- the format key that slice 0 exercised here no longer
# exists at all.
#
# This stays the small, ordinary face slice 0 introduced -- digital time, a
# date, a battery ring, a bezel -- not a format-feature showcase. The
# face-wide `aod: {default: hide}` below is the canonical "everything off
# but the time" shape (plan 14 §3): every element the ancestry says nothing
# about is hidden in AOD, and the one line on `clock` turns it back on, with
# a dimmer colour than its awake white -- Garmin's own guidance is to avoid
# white/blue and prefer light grey (research 11 §1.3). Slice 1 resolves and
# validates that override but does not yet apply it in the generated sleep
# frame: the AOD frame this build produces draws `clock` with its *awake*
# styling, unrestyled -- restyling ternaries land in slice 2
# (docs/limitations.md §2).
#
# `fenix847mm` (round-454x454, AMOLED, `requiresBurnInProtection` --
# docs/research/11-always-on-display.md §2) is the fourth target, installed
# by `tools/setup-env.sh` (plan 14 slice 0). The generated view is shared
# across every target in one build (root CLAUDE.md §1); the three MIP
# verification devices never see a lit `_aod` (D5: their sleep frame stays
# exactly the awake design), and their generated source is unaffected by
# `aod:` at all, on purpose -- see the byte-identical test in
# `tests/test_aod_codegen.py`.
#
# Build it with:     ./wfb.py build examples/features/aod/face.yaml
# Preview it with:   ./wfb.py preview examples/features/aod/face.yaml --aod
#
# yaml-language-server: $schema=../../schema/wfb-face-1.schema.json

format: 1

face:
  id: 5a3e9c71-2f84-4b6d-9e10-7c8a2d4f61b5
  name: Feature AOD
  version: 1.0.0

targets:
  - fenix847mm
  - fenix8solar47mm
  - fenix8solar51mm
  - fr955

aod:
  default: hide

palette:
  black: "#000000"
  white: "#FFFFFF"
  gray: "#AAAAAA"
  dim: "#555555"
  accent: "#00AAFF"

elements:
  - id: background
    type: shape
    shape: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: palette.black

  - id: bezel_ring
    type: shape
    shape: circle
    at: { anchor: center }
    radius: 95%r
    filled: false
    thickness: 1px
    color: palette.gray

  - id: date_text
    type: text
    value: date.today
    format: "{:%a %d}"
    font: FONT_XTINY
    at: { anchor: center, dy: -30% }
    color: palette.gray

  # The one element shown in AOD: the face default (`hide`) leaves every
  # other element off, and this one line turns the clock back on -- the
  # canonical "everything off but the time" shape (plan 14 §3). `color:`
  # here is what slice 2's restyling will apply; today it is resolved and
  # validated (`Element.aod.color`) but not yet read by codegen, which
  # still draws this element with its own awake `color:` while `_aod`.
  - id: clock
    type: text
    value: time.clock
    format: "{:%H:%M}"
    font: FONT_NUMBER_MEDIUM
    at: { anchor: center }
    color: palette.white
    aod:
      color: palette.dim

  - id: battery_ring
    type: progress
    style: arc
    value: system.battery
    max: 100
    at: { anchor: center }
    radius: 88%r
    thickness: 3%r
    start_angle: 270deg
    sweep: 300deg
    color: palette.accent
    track_color: palette.dim
