# Always-on display (docs/guide/always-on-display.md): `aod:` as overrides
# on the one design.
#
# A small, ordinary face -- digital time, a date, a battery ring, a bezel --
# not a format-feature dump. The face-wide `defaults: {aod: hide}` and
# `aod: {dim: 0.6}` below are the canonical "everything off but the time"
# shape, plus a face-wide dim: every element the ancestry says nothing about
# is hidden in AOD, and each `aod:` block below restyles its element with a
# ternary at the draw call site:
#
# - `clock` turns hollow in AOD: `outline:` draws a dim grey ring the awake
#   design does not have, and `color:` paints the interior black, so only
#   the ring lights -- the "outlined digits" shape, far fewer lit pixels than solid digits. It also swaps
#   its `text:` template to a different separator (the same mechanism a design would
#   use to drop seconds -- free, since AOD redraws once a minute anyway --
#   kept as a same-width swap here so the widest-rendering estimate, which
#   is measured against the *awake* format only, still fits fēnix 8's
#   screen). Its explicit `color:` and `outline:` colours are the author's
#   final word: `dim: 0.6` never touches them.
# - `accent_dot` is a small filled accent, awake -- `aod: {filled: false}`
#   turns it into a thin ring instead of a filled disc in AOD, the "solid
#   disc becomes a thin ring" guidance applied to the
#   smallest lit shape this face has, in miniature -- and, with **no**
#   `color:` override of its own, its awake blue is dimmed automatically:
#   `dim: 0.6` reaches every AOD colour, override or not, which is the
#   contrast this element is here to show against `clock`'s explicit one.
# - `battery_ring` shows in AOD too, thinner and dimmer than its awake ring
#   (`thickness:`/`color:` overrides) -- exactly the kind of secondary
#   reading Garmin's own guidance says to keep legible but unobtrusive.
# - `info` is a `group` with an explicit `aod: hide`: unconditional and
#   sticky (the one asymmetry) -- `date_text`'s own `aod: show`
#   inside it can never draw, which is *why* it needs `lint: {allow:
#   [aod-unreachable]}` here: this pairing is deliberately demonstrating the
#   rule the lint exists to catch, not an oversight.
#
# `fenix847mm` (round-454x454, AMOLED, `requiresBurnInProtection`) is the fourth target, installed
# by `tools/setup-env.sh`. The generated view is shared across every target
# in one build (root CLAUDE.md §1); the three MIP verification devices never
# see a lit `_aod` (their sleep frame stays exactly the awake design).
#
# This face's `aod:` block above also gets the moving 2x2 pixel mask (docs/guide/always-on-display.md "Pixel mask"),
# on by default -- no `mask:` key is written here, the same way no design
# has to ask for it. `aod-burn-in`'s own note now scores the masked frame
# (1.0% lit, 0.1% luminance, down from 4.0%/0.3% unmasked).
#
# Build it with:     ./wfb build examples/features/aod/face.yaml
# Preview it with:   ./wfb preview examples/features/aod/face.yaml --aod
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 5a3e9c71-2f84-4b6d-9e10-7c8a2d4f61b5
  name: Feature AOD
  version: 1.0.0

build:
  targets:
    - fenix847mm
    - fenix8solar47mm
    - fenix8solar51mm
    - fr955

defaults:
  aod: hide
aod:
  dim: 0.6

resources:
  palette:
    black: "#000000"
    white: "#FFFFFF"
    gray: "#AAAAAA"
    dim: "#555555"
    accent: "#00AAFF"

elements:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.black

  bezel_ring:
    type: circle
    at: { anchor: center }
    radius: 95%r
    filled: false
    thickness: 1px
    color: color.gray

  # An explicit group hide is unconditional and sticky: no
  # descendant can undo it, whatever it writes itself. `date_text`'s own
  # `aod: show` is deliberately unreachable, to demonstrate exactly that --
  # see the header comment above.
  info:
    type: group
    aod: hide
    children:
      date_text:
        type: text
        text: "{date.today:%a %d}"
        font: FONT_XTINY
        at: { anchor: center, dy: -30% }
        color: color.gray
        aod: show
        lint:
          allow: [aod-unreachable]
          reason: >-
            deliberate: demonstrates that a group's own 'aod: hide' beats a
            descendant's 'aod: show' (docs/guide/always-on-display.md)

  # A small filled accent while awake -- becomes a thin ring in AOD (the
  # "solid disc becomes a thin ring" guidance), in its own awake blue
  # dimmed automatically to 60% (no `color:` override here -- `dim:`
  # reaches it anyway, which is the point of leaving it out).
  accent_dot:
    type: circle
    at: { anchor: center, dy: 24% }
    radius: 3%r
    filled: true
    color: color.accent
    aod:
      filled: false
      thickness: 2px

  # The one element the face default would leave off but this design turns
  # back on -- the canonical "everything off but the time" shape,
  # hollow in AOD: a ring the awake design does not draw, around a
  # black interior, and a different (same-width) format string.
  clock:
    type: text
    text: "{time.clock:%H:%M}"
    font: FONT_NUMBER_MEDIUM
    at: { anchor: center }
    color: color.white
    aod:
      text: "{time.clock:%H %M}"
      color: color.black
      outline:
        width: 2
        color: color.dim

      # font: FONT_NUMBER_MILD

  battery_ring:
    type: gauge
    style: arc
    value: system.battery
    max: 100
    at: { anchor: center }
    radius: 88%r
    thickness: 3%r
    start_angle: 270deg
    sweep: 300deg
    color: color.accent
    track_color: color.dim
    aod:
      color: color.dim
      thickness: 1%r
