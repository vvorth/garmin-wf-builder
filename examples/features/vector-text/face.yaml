# Vector fonts and `curve:` (docs/guide/fonts.md "Vector (`face:`) fonts", and
# docs/guide/text.md "`curve:` -- rotated and radial text").
#
# A rugged field-watch dial: twelve numerals turn to sit tangent to their
# own radius around a compass-style bezel, a wordmark curves along the
# bottom rim, and a diagonal "SOLAR" ribbon marks the two solar-charging
# targets. What this exercises:
#
# * **Two kinds of `fonts:` entry, coexisting** (`docs/guide/fonts.md`):
#   `clock` bakes a bitmap sheet from `assets/ChivoMono-Bold.ttf`, the way
#   every other example's fonts do; `dial` instead names a **device-resident
#   scalable face** with `face:` -- nothing is rasterised for it at build
#   time, so it can be drawn upright, angled or radial at any size.
# * **A `face:` candidate list, so the per-device resolution is actually
#   visible**: `face: [BionicSemiBold, RobotoCondensedBold]`. Only
#   `fenix8solar47mm`/`fenix8solar51mm` publish `BionicSemiBold`; `fr955`
#   does not (it has `RobotoBlack`/`BionicBold` instead -- a different name,
#   not a fallback match), so `dial` resolves to `BionicSemiBold` on the two
#   fenix targets and to `RobotoCondensedBold` on fr955. The numeral ring
#   and the bottom wordmark genuinely render in a different face on fr955 --
#   check the three renders side by side to see it.
# * **`curve: {style: radial}` on a `text` element** (`wordmark`): "FIELD
#   TRACK" bent along the bottom rim, `direction: counter_clockwise` so it
#   faces inward and reads right-side up along the bottom of the dial --
#   this is the very build that confirmed `wfb preview`'s radial
#   glyph-facing model against the real simulator (2026-09-21,
#   `fenix8solar47mm`). `radial`'s
#   `angle:` is a POSITION -- where around the circle the text starts --
#   this format's usual 12-o'clock-is-0, clockwise convention, same as every
#   other angle in the format.
# * **`curve: {style: angled}` on a `text` element** (`solar_badge`): a
#   tilted ribbon, the plain rotated-baseline case. `angled`'s `angle:` is a
#   ROTATION, not a position (`docs/guide/placement.md` "Angles"): `0deg` is level,
#   unrotated text, and this ribbon's `35deg` is 35 degrees clockwise from
#   level -- not "35 degrees clockwise from 12 o'clock" the way a `radial`
#   angle or an arc's `start_angle:` would read it.
# * **A pattern `type: text` part with `curve:`** (`hour_numerals`): the
#   twelve-hour-numerals case `docs/limitations.md` used to carry as
#   impossible ("a bitmap font cannot turn, so only the anchor turns") --
#   one authored `angle: 0deg`, in the template's own local frame, composed
#   per copy with the radial pattern's own rotation, so the whole ring is
#   one authored angle, not twelve. `0deg` here means "no rotation" (level),
#   the same as a standalone `angled` element's `0deg` -- composed with each
#   copy's own turn around the dial, it makes every numeral sit tangent to
#   its own radius: level at "12", on its side at "3" and "9", upside down
#   at "6" -- verified by rendering, not assumed. This is the one case where
#   the rotation convention actually pays for itself: the natural "no extra
#   tilt" angle for a tangent ring is the same `0deg` you would reach for
#   for level text anywhere else, not a value you have to look up.
# * **`unsupported: hide` doing real work, not a decorative key**:
#   `solar_badge`'s own font, `accent`, names `BionicSemiBold` alone -- no
#   fallback list -- and that face does not exist on fr955. Without
#   `unsupported: hide` on it, the build would fail on fr955 naming the
#   missing face. With it, the badge simply is not drawn there, which is
#   also the thematically correct outcome: fr955 is not a solar watch, and
#   fenix8solar47mm/51mm are. Nothing about *that* correctness is checked by
#   the compiler -- it is a coincidence of Garmin's own on-device font
#   catalogue -- but it is why this design chose `BionicSemiBold` for the
#   badge rather than a face every target happens to share.
#
# Build it with:    ./wfb build examples/features/vector-text/face.yaml
# Preview it with:  ./wfb preview examples/features/vector-text/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: a3c8a862-4713-431e-a51f-27e99a4edcd2
  name: Feature Vector Text
  version: 1.0.0

build:
  targets:
    - fenix8solar47mm
    - fenix8solar51mm
    - fr955

# Every colour is one the 64-colour MIP panel shows without dithering: each
# channel is 0x00, 0x55, 0xAA or 0xFF (CLAUDE.md constraint 13).
resources:
  fonts:
    clock:
      source: assets/ChivoMono-Bold.ttf   # baked: the ordinary case
      size: 24%r
      monospace: true
      antialias: true

    dial:
      # device-resident, scalable -- resolved per device from this list, not
      # rasterised at build time. BionicSemiBold is on the two fenix8 solar
      # targets; fr955 falls through to RobotoCondensedBold.
      face: [BionicSemiBold, RobotoCondensedBold]
      size: 14%r

    accent:
      # a single name, deliberately with no fallback: fr955 does not publish
      # it, so unsupported: hide (below) is load-bearing, not decorative.
      face: BionicSemiBold
      size: 7%r
      unsupported: hide

  palette:
    black: "#000000"
    white: "#FFFFFF"
    gray: "#AAAAAA"
    amber: "#FF5500"

elements:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.black

  bezel_ring:
    type: circle
    at: { anchor: center }
    radius: 95%r
    filled: false
    thickness: 1px
    color: color.gray

  # Twelve hour numerals, each rotated to sit tangent to its own radius --
  # docs/guide/patterns.md "Text parts". One authored angle, not twelve.
  hour_numerals:
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 12
    color: color.white
    parts:
      - type: text
        text: "{(copy + 11) % 12 + 1}"
        font: font.dial
        at: { dy: -82%r }
        curve:
          style: angled
          angle: 0deg

  clock:
    type: text
    text: "{time.clock:%H:%M}"
    font: font.clock
    at: { anchor: center, dy: -6% }
    color: color.white

  today:
    type: text
    text: "{date.today:%a %e}"
    font: FONT_TINY
    at: { anchor: center, dy: 14% }
    color: color.gray

  # A wordmark bent along the bottom rim. curve: radial's `at:` is the
  # CENTRE of the circle, not a point the text sits on -- docs/guide/text.md.
  # counter_clockwise faces the glyphs inward, so text along the bottom of
  # the dial still reads right-side up.
  wordmark:
    type: text
    text: "FIELD TRACK"
    font: font.dial
    color: color.gray
    at: { anchor: center }
    curve:
      style: radial
      angle: 165deg
      radius: 60%r
      direction: counter_clockwise

  left_cw:
    type: text
    text: "WORLD'S END"
    font: font.dial
    color: color.gray
    at: { anchor: center }
    curve:
      style: radial
      angle: 270deg
      radius: 60%r
      direction: clockwise

  top_ccw:
    type: text
    text: "TOP CCW"
    font: font.dial
    color: color.gray
    at: { anchor: center }
    align: top_left
    curve:
      style: radial
      angle: 350deg
      radius: 60%r
      direction: counter_clockwise

  top_cw:
    type: text
    text: "TOP CW"
    font: font.dial
    color: color.white
    at: { anchor: center }
    align: top_left
    curve:
      style: radial
      angle: 350deg
      radius: 60%r
      direction: clockwise

  # A tilted "SOLAR" ribbon, upper right -- only on the two solar-charging
  # targets, because font.accent's face is only published there. This is
  # the unsupported: hide that matters: without it this element's own
  # font would fail gate 3 on fr955 and the whole build would error.
  solar_badge:
    type: text
    text: "SOLAR"
    font: font.accent
    color: color.amber
    at: { anchor: center, dx: 34%r, dy: -50%r }
    curve:
      style: angled
      angle: 35deg
    lint:
      allow: [font-unavailable]
      reason: "font.accent (BionicSemiBold) is deliberately single-name, no
        fallback: fr955 does not publish it, if_unavailable: hide is the
        point of this element, and fr955 is not a solar watch anyway."
