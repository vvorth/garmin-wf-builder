# Generated by tools/gen-profile-face.py -- edit that, not this.
#
# A profiling face for `outline:`: sixteen drawables on a 4x4
# grid -- the three grown shapes, every stamped shape, text in a baked font
# (ringed from its baked ring font) and in a system font (stamped), an icon, a
# pattern, two gauges, hands and a group -- in two layouts: no outline, and
# a 1px ring.  Switch between them with the watch's style
# setting (the native editor, or the generated settings menu on fr955).
#
# Build it instrumented, sideload it and read the numbers off the watch:
#
#     ./wfb.py build examples/features/profile/face.yaml --profile
#
# Each element's average draw time per call, in microseconds, appears above
# it; the top line is the last frame's time, the app's memory, and the
# empty-loop baseline to subtract.  An outlined group's ring pass is timed
# on its own.  See docs/guide/preview-and-cli.md, "Profiling".
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 5c3a9e82-7d14-4b6f-a0e3-8f2d1c6b9a47
  name: Feature Profile
  version: 1.0.0

build:
  targets:
    - fenix8solar47mm
    - fenix8solar51mm
    - fr955

resources:
  fonts:
    digits:
      source: ../outline/assets/ChivoMono-Bold.ttf
      size: 8%r

  palette:
    bg: "#000000"
    fill: "#AA00FF"
    ring: "#FFFF00"
    track: "#555555"

  hand_sets:
    mini:
      hour:
        color: color.fill
        parts:
          - type: polygon
            points: [{ dx: -2%r, dy: 2%r }, { dy: -7%r }, { dx: 2%r, dy: 2%r }]
      minute:
        color: color.fill
        parts:
          - { type: rectangle, at: { dy: -4%r }, size: { width: 1%r, height: 10%r } }

config:
  style:
    default: plain
    choices:
      plain: { label: "No outline", layout: plain }
      ring: { label: "1px outline", layout: ring }

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

layouts:
  plain:
    elements:
      disc_plain:
        type: circle
        at: { anchor: center, dx: -27%, dy: -22% }
        radius: 6%r
        color: color.fill

      card_plain:
        type: rectangle
        at: { anchor: center, dx: -9%, dy: -22% }
        size: { width: 12%, height: 7% }
        color: color.fill

      pill_plain:
        type: rectangle
        at: { anchor: center, dx: 9%, dy: -22% }
        size: { width: 12%, height: 7% }
        corner_radius: 4px
        color: color.fill

      egg_plain:
        type: ellipse
        at: { anchor: center, dx: 27%, dy: -22% }
        size: { width: 13%, height: 8% }
        color: color.fill

      hoop_plain:
        type: circle
        at: { anchor: center, dx: -27%, dy: -5% }
        radius: 6%r
        thickness: 3px
        filled: false
        color: color.fill

      label_plain:
        type: text
        text: "12:34"
        font: FONT_XTINY
        at: { anchor: center, dx: -9%, dy: -5% }
        color: color.fill

      arc_plain:
        type: arc
        at: { anchor: center, dx: 9%, dy: -5% }
        radius: 6%r
        thickness: 3px
        start_angle: 300deg
        sweep: 120deg
        color: color.fill

      tri_plain:
        type: polygon
        points:
          - { anchor: center, dx: 21%, dy: -1% }
          - { anchor: center, dx: 27%, dy: -9% }
          - { anchor: center, dx: 33%, dy: -1% }
        color: color.fill

      rule_plain:
        type: line
        at: { anchor: center, dx: -33%, dy: 12% }
        to: { anchor: center, dx: -21%, dy: 12% }
        thickness: 2px
        color: color.fill

      digits_plain:
        type: text
        text: "12:34"
        font: font.digits
        at: { anchor: center, dx: -9%, dy: 12% }
        color: color.fill

      alarm_plain:
        type: icon
        icon: alarm
        size: 12%r
        at: { anchor: center, dx: 9%, dy: 12% }
        color: color.fill

      ticks_plain:
        type: pattern
        pattern: radial
        at: { anchor: center, dx: 27%, dy: 12% }
        count: 8
        step: 45deg
        color: color.fill
        parts:
          - { type: line, at: { dy: -9%r }, to: { dy: -5%r }, thickness: 2px }

      battery_plain:
        type: gauge
        style: arc
        value: system.battery
        max: 100
        at: { anchor: center, dx: -27%, dy: 29% }
        radius: 6%r
        thickness: 3px
        start_angle: 240deg
        sweep: 240deg
        color: color.fill
        track_color: color.track

      steps_plain:
        type: gauge
        style: bar
        value: system.battery
        max: 100
        at: { anchor: center, dx: -9%, dy: 29% }
        size: { width: 13%, height: 3% }
        color: color.fill
        track_color: color.track

      badge_plain:
        type: group
        at: { anchor: center, dx: 9%, dy: 29% }
        size: { width: 16%, height: 8% }
        children:
          badge_plain_icon: { type: icon, icon: heart, size: 8%r, at: { anchor: left }, align: left, color: color.fill }
          badge_plain_value: { type: text, text: "72", font: FONT_XTINY, at: { anchor: right }, align: right, color: color.fill }

      hands_plain:
        type: hands
        set: mini
        at: { anchor: center, dx: 27%, dy: 29% }

  ring:
    elements:
      disc_ring:
        type: circle
        at: { anchor: center, dx: -27%, dy: -22% }
        radius: 6%r
        color: color.fill
        outline: color.ring

      card_ring:
        type: rectangle
        at: { anchor: center, dx: -9%, dy: -22% }
        size: { width: 12%, height: 7% }
        color: color.fill
        outline: color.ring

      pill_ring:
        type: rectangle
        at: { anchor: center, dx: 9%, dy: -22% }
        size: { width: 12%, height: 7% }
        corner_radius: 4px
        color: color.fill
        outline: color.ring

      egg_ring:
        type: ellipse
        at: { anchor: center, dx: 27%, dy: -22% }
        size: { width: 13%, height: 8% }
        color: color.fill
        outline: color.ring

      hoop_ring:
        type: circle
        at: { anchor: center, dx: -27%, dy: -5% }
        radius: 6%r
        thickness: 3px
        filled: false
        color: color.fill
        outline: color.ring

      label_ring:
        type: text
        text: "12:34"
        font: FONT_XTINY
        at: { anchor: center, dx: -9%, dy: -5% }
        color: color.fill
        outline: color.ring
        lint:
          allow: [text-outline-interior]
          reason: "a ringed, filled numeral: the interior is meant to show"

      arc_ring:
        type: arc
        at: { anchor: center, dx: 9%, dy: -5% }
        radius: 6%r
        thickness: 3px
        start_angle: 300deg
        sweep: 120deg
        color: color.fill
        outline: color.ring

      tri_ring:
        type: polygon
        points:
          - { anchor: center, dx: 21%, dy: -1% }
          - { anchor: center, dx: 27%, dy: -9% }
          - { anchor: center, dx: 33%, dy: -1% }
        color: color.fill
        outline: color.ring

      rule_ring:
        type: line
        at: { anchor: center, dx: -33%, dy: 12% }
        to: { anchor: center, dx: -21%, dy: 12% }
        thickness: 2px
        color: color.fill
        outline: color.ring

      digits_ring:
        type: text
        text: "12:34"
        font: font.digits
        at: { anchor: center, dx: -9%, dy: 12% }
        color: color.fill
        outline: color.ring
        lint:
          allow: [text-outline-interior]
          reason: "a ringed, filled numeral: the interior is meant to show"

      alarm_ring:
        type: icon
        icon: alarm
        size: 12%r
        at: { anchor: center, dx: 9%, dy: 12% }
        color: color.fill
        outline: color.ring

      ticks_ring:
        type: pattern
        pattern: radial
        at: { anchor: center, dx: 27%, dy: 12% }
        count: 8
        step: 45deg
        color: color.fill
        parts:
          - { type: line, at: { dy: -9%r }, to: { dy: -5%r }, thickness: 2px }
        outline: color.ring

      battery_ring:
        type: gauge
        style: arc
        value: system.battery
        max: 100
        at: { anchor: center, dx: -27%, dy: 29% }
        radius: 6%r
        thickness: 3px
        start_angle: 240deg
        sweep: 240deg
        color: color.fill
        track_color: color.track
        outline: color.ring

      steps_ring:
        type: gauge
        style: bar
        value: system.battery
        max: 100
        at: { anchor: center, dx: -9%, dy: 29% }
        size: { width: 13%, height: 3% }
        color: color.fill
        track_color: color.track
        outline: color.ring

      badge_ring:
        type: group
        at: { anchor: center, dx: 9%, dy: 29% }
        size: { width: 16%, height: 8% }
        children:
          badge_ring_icon: { type: icon, icon: heart, size: 8%r, at: { anchor: left }, align: left, color: color.fill }
          badge_ring_value: { type: text, text: "72", font: FONT_XTINY, at: { anchor: right }, align: right, color: color.fill }
        outline: color.ring

      hands_ring:
        type: hands
        set: mini
        at: { anchor: center, dx: 27%, dy: 29% }
        outline: color.ring
