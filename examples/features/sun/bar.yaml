format: 2

face:
  id: 3d9a7c14-6b28-4e55-8a10-cf42d7b90e63
  name: Feature Sun Bar
  version: 1.0.0

build:
  targets: [fenix8solar47mm, fenix8solar51mm, fr955]
resources:
  palette:
    bg: "#000000"
    sun: "#FFAA00"
    track: "#555555"

elements:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg
    filled: true

  daylight:
    type: gauge
    style: bar
    value: >-
      (time.hour * 3600 + time.minute * 60 + time.second >= complication.sunrise
       and time.hour * 3600 + time.minute * 60 + time.second <= complication.sunset)
      ? time.hour * 3600 + time.minute * 60 + time.second - complication.sunrise
      : 0
    max: complication.sunset - complication.sunrise
    at: { anchor: center }
    size: { width: 70%, height: 8px }
    color: color.sun
    track_color: color.track
    absent: hide
