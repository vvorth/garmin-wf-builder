# Static content in an offscreen buffer.
#
# Everything under `static:` is painted once, in onLayout, into a full-screen
# Graphics.BufferedBitmap; every frame after that draws it with one
# `dc.drawBitmap(0, 0, buffer)` instead of re-running twenty primitives.  The
# buffer lives in the graphics pool -- 1 MB on every target here -- which is a
# separate budget from the 128 KB the watch face itself gets.
#
# Build it with:  ./wfb.py build examples/static/face.yaml
#
# Two things this example is deliberately honest about:
#
#   * The *benefit* is CPU and battery, and nothing in this repository has
#     measured it -- there is no simulator in the container and no watch.  What
#     is verified is that it compiles warning-free on all three targets, that
#     the no-buffer fallback draws the same picture, and what it costs in bytes.
#     See docs/limitations.md.
#   * The buffer is **opaque**, so static content must come first in draw order.
#     Whether a transparent buffer would work on a device with
#     `alphaBlendingSupport: false` could not be established from the SDK; the
#     evidence, both ways, is in docs/research/probes/static-buffer/.  Writing
#     the fixed furniture in a top-level `static:` block gets the ordering right
#     by construction, which is the main reason to prefer that spelling.
#
# Nothing in a static subtree may read a data source -- the buffer is filled
# once and never refilled, so a binding here would freeze on the first frame.
# The compiler rejects it by name rather than letting it happen.
#
# yaml-language-server: $schema=../../schema/wfb-face-1.schema.json

format: 1

face:
  id: 6b1a0d74-32c8-4f59-9a2d-5e7c81b04f36
  name: Static
  version: 1.0.0

targets:
  - fenix8solar47mm
  - fenix8solar51mm
  - fr955

# Every colour is one the 64-colour MIP panel can show without dithering:
# each channel is 0x00, 0x55, 0xAA or 0xFF.  The linter checks this.
palette:
  bg: "#000000"
  text: "#FFFFFF"
  accent: "#FF5500"
  dim: "#AAAAAA"

# The furniture: a background, a bezel ring, four quarter ticks and two printed
# labels.  None of it changes for as long as the face is on the wrist, so all of
# it is painted once and blitted afterwards.
static:
  background:
    type: shape
    shape: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: palette.bg

  # A plain, unbound arc -- the ring the step progress below is drawn against.
  # Static because the *track* never moves; only the filled part does, and that
  # is the `progress` element in `elements:`.
  bezel:
    type: shape
    shape: arc
    at: { anchor: center }
    radius: 90%r
    thickness: 10px
    start_angle: 0deg
    sweep: 360deg
    color: palette.dim

  # A group is the natural home for a set of marks that belong together.  It is
  # inside the static block, so it needs no `static: true` of its own -- one is
  # already in force, and a nested one is an error saying exactly that.
  quarter_ticks:
    type: group
    children:
      - id: tick_12
        type: shape
        shape: line
        at: { anchor: center, dy: -84%r }
        to: { anchor: center, dy: -72%r }
        thickness: 3px
        color: palette.dim
      - id: tick_3
        type: shape
        shape: line
        at: { anchor: center, dx: 84%r }
        to: { anchor: center, dx: 72%r }
        thickness: 3px
        color: palette.dim
      - id: tick_6
        type: shape
        shape: line
        at: { anchor: center, dy: 84%r }
        to: { anchor: center, dy: 72%r }
        thickness: 3px
        color: palette.dim
      - id: tick_9
        type: shape
        shape: line
        at: { anchor: center, dx: -84%r }
        to: { anchor: center, dx: -72%r }
        thickness: 3px
        color: palette.dim

  steps_caption:
    type: text
    text: "STEPS"
    font: FONT_XTINY
    at: { anchor: center, dy: 24% }
    color: palette.dim

  heart_caption:
    type: text
    text: "BPM"
    font: FONT_XTINY
    at: { anchor: center, dy: -30% }
    color: palette.dim

# Everything that moves.  These draw over the blit, in the order written.
elements:
  - id: heart_rate
    type: text
    value: heart_rate.current
    format: "{:d}"
    font: FONT_MEDIUM
    at: { anchor: center, dy: -21% }
    color: palette.text
    when_absent: placeholder
    placeholder: "--"

  - id: clock
    type: text
    value: time.clock
    format: "{:%h:%M}"
    font: FONT_NUMBER_HOT
    at: { anchor: center, dy: -2% }
    color: palette.text

  - id: steps
    type: text
    value: activity.steps
    format: "{:d}"
    font: FONT_SMALL
    at: { anchor: center, dy: 31% }
    color: palette.accent
    when_absent: placeholder
    placeholder: "0"
    on_hold: auto

  # The moving half of the ring whose track is static above.  Sweeps clockwise
  # from 12 o'clock; the static `bezel` shows through wherever it has not
  # reached yet, because this one draws no track of its own.
  - id: step_ring
    type: progress
    style: arc
    value: activity.steps
    max: activity.step_goal
    at: { anchor: center }
    radius: 90%r
    thickness: 10px
    start_angle: 0deg
    sweep: 360deg
    color: palette.accent
    when_absent: hide
