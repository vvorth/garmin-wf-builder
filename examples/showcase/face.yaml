# Showcase -- one face, two layouts switched by Styles: `analog` (a quiet
# three-hand dial with tick and numeral patterns) and `digital` (a dense
# dashboard: two-tone clock, weather row, heart-rate graph, data clusters,
# progress bar and ring, status row). Two shared `complication_slot`
# registers draw beneath both.
#
# Config: several colour schemes paired with the layouts as `config: style:`
# entries, both colour axes, and the Data axis (the two registers). fr955
# has no native editor, so it keeps every default.
#
# Build it:    ./wfb.py build examples/showcase/face.yaml
# Preview it:  ./wfb.py preview examples/showcase/face.yaml --all-styles
#
# yaml-language-server: $schema=../../schema/wfb-face-1.schema.json

format: 1

face:
  id: 5ca5867b-1d30-4581-94c0-617033e6824c
  name: Showcase
  version: 1.1.0

targets:
  - fenix8solar47mm
  - fenix8solar51mm
  - fr955

fonts:
  digitalclock:
    source: assets/ChivoMono-Bold.ttf
    size: 60%r
    monospace: true
    align: center
    antialias: true
  dialfont:
    source: assets/Dynalight-Regular.ttf
    size: 13%r
    antialias: true

palette:
  black: { value: "#000000", label: "Black" }
  white: { value: "#FFFFFF", label: "White" }
  light_gray: { value: "#AAAAAA", label: "Light Gray" }
  dark_gray: { value: "#555555", label: "Dark Gray" }
  darkest_blue: { value: "#000055", label: "Midnight" }
  red: { value: "#FF0000", label: "Red" }
  orange: { value: "#FF5500", label: "Orange" }
  amber: { value: "#FFAA00", label: "Amber" }
  yellow: { value: "#FFFF00", label: "Yellow" }
  green: { value: "#00FF00", label: "Green" }
  lime_green: { value: "#AAFF00", label: "Lime Green" }
  cyan: { value: "#00FFFF", label: "Cyan" }
  sky_blue: { value: "#00AAFF", label: "Sky Blue" }
  light_blue: { value: "#55FFFF", label: "Light Blue" }
  magenta: { value: "#FF00FF", label: "Magenta" }
  dark_green: { value: "#005500", label: "Dark Green" }
  dark_red: { value: "#550000", label: "Dark Red" }

color_scheme:
  dark:
    label: "Dark"
    colors: { bg: palette.black, fg: palette.white, dim: palette.light_gray, dark: palette.dark_gray, track: palette.light_gray, notify: palette.black }
  light:
    label: "Light"
    colors: { bg: palette.white, fg: palette.black, dim: palette.dark_gray, dark: palette.light_gray, track: palette.dark_gray, notify: palette.white }
  navy:
    label: "Navy"
    colors: { bg: palette.darkest_blue, fg: palette.white, dim: palette.light_gray, dark: palette.dark_gray, track: palette.light_gray, notify: palette.black }
  crimson:
    label: "Crimson"
    colors: { bg: palette.dark_red, fg: palette.white, dim: palette.light_gray, dark: palette.dark_gray, track: palette.light_gray, notify: palette.black }

config:
  accent_color:
    default: palette.red
    choices:
      - palette.orange
      - palette.red
      - palette.amber
      - palette.cyan
      - palette.lime_green
      - palette.green
      - palette.magenta
      - palette.yellow
  data_color:
    default: palette.amber
    choices:
      - palette.red
      - palette.cyan
      - palette.lime_green
      - palette.green
      - palette.amber
      - palette.magenta
      - palette.yellow
  style:
    default: digital_dark
    choices:
      analog_dark:   { label: "Analog · Dark",  layout: analog,  colors: dark }
      analog_light:  { label: "Analog · Light", layout: analog,  colors: light }
      # analog_navy:   { label: "Analog · Navy",  layout: analog,  colors: navy }
      analog_crimson: { label: "Analog · Crimson",  layout: analog,  colors: crimson }
      digital_dark:  { label: "Digital · Dark", layout: digital, colors: dark }
      digital_light: { label: "Digital · Light", layout: digital, colors: light }
  data:
    left_register:
      default: complication.steps
      choices:
        - complication.steps
        - complication.heart_rate
        - { type: complication.calories, icon: none }
    right_register:
      default: complication.body_battery
      choices: any

# One named hand set, authored pointing at 12 o'clock, origin = the axis
# (docs/format.md "Analog hands"). Tapered hour/minute polygons plus a
# needle-thin second hand whose tip is the one native accent-colour axis.
hands:
  classic:
    hour:
      color: config.colors.fg
      parts:
        - shape: polygon
          points:
            - { dx: -3%r, dy: 8%r }
            - { dx: -2%r, dy: -38%r }
            - { dy: -46%r }
            - { dx: 2%r, dy: -38%r }
            - { dx: 3%r, dy: 8%r }
    minute:
      color: config.colors.fg
      parts:
        - { shape: rectangle, at: { dy: -34%r }, size: { width: 3%r, height: 78%r } }
        - { shape: circle, radius: 4%r }
    second:
      color: config.colors.dim
      parts:
        - { shape: line, at: { dy: 14%r }, to: { dy: -76%r }, thickness: 1px }
        - { shape: circle, at: { dy: 14%r }, radius: 3%r }
        - { shape: circle, radius: 2%r, color: config.accent_color }
        - { shape: line, at: { dy: -76%r }, to: { dy: -64%r }, thickness: 2px, color: config.accent_color }

# Shared: drawn underneath both layouts, in every one of them -- two side
# "registers" (a re-pointable complication behind a card) and a small date
# window, the same three shapes every layout benefits from.
static:
  background:
    type: shape
    shape: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: config.colors.bg

  left_card:
    type: shape
    shape: rounded_rectangle
    at: { anchor: center, dx: -50%r, dy: -23%r }
    size: { width: 42%r, height: 19%r }
    corner_radius: 3%r
    color: config.colors.dark

  right_card:
    type: shape
    shape: rounded_rectangle
    at: { anchor: center, dx:  50%r, dy: -23%r }
    size: { width: 42%r, height: 19%r }
    corner_radius: 3%r
    color: config.colors.dark

  # date_window:
  #   type: shape
  #   shape: rounded_rectangle
  #   at: { anchor: center, dy: 48%r }
  #   size: { width: 30%r, height: 12%r }
  #   corner_radius: 2%r
  #   color: config.colors.dark
  #   lint:
  #     allow: [static-overlap]
  #     reason: "the digital layout's bottom status row (dnd/notification/alarm)
  #       draws well clear of this window on every target; the overlap the
  #       linter flags is between the two elements' declared boxes, not their
  #       ink -- see docs/format.md 'static:'"

elements:
  left_register:
    type: complication_slot
    slot: config.data.left_register
    at: { anchor: center, dx: -50%r, dy: -30%r }
    font: FONT_XTINY
    icon_size: 9%r
    icon_position: top
    icon_gap: 1%r
    icon_color: config.data_color
    color: config.colors.fg
    label: none
    when_absent: placeholder
    placeholder: "--"
    on_hold: auto
    lint:
      allow: [config-unsupported, static-overlap]
      reason: "fr955 has no native editor and keeps this register's declared
        default forever -- see the header comment. static-overlap: the
        analog layout's full-dial tick/numeral patterns bound this register
        card's overlap box (any dynamic element trivially overlaps a
        full-circle pattern's bounding disc), but no ink from either pattern
        actually falls inside this card at dx -42%r -- the numerals sit at
        radius 78%r along the 3/9 o'clock row, well clear of it"

  right_register:
    type: complication_slot
    slot: config.data.right_register
    at: { anchor: center, dx: 50%r, dy: -30%r }
    font: FONT_XTINY
    icon_size: 9%r
    icon_position: top
    icon_gap: 1%r
    icon_color: config.data_color
    color: config.colors.fg
    label: none
    when_absent: placeholder
    placeholder: "--"
    lint:
      allow: [config-unsupported, static-overlap]
      reason: "fr955 has no native editor and keeps this register's declared
        default forever -- see the header comment. static-overlap: same
        full-dial-pattern bounding-box overstatement as left_register above,
        mirrored at dx +42%r"

  # date_text:
  #   type: text
  #   value: date.today
  #   format: "{:%a %e %b}"
  #   font: FONT_XTINY
  #   at: { anchor: center, dy: 48%r }
  #   color: config.colors.fg
  #   lint:
  #     allow: [static-overlap]
  #     reason: "same full-dial-pattern bounding-box overstatement as the two
  #       registers above -- this window sits on the 6 o'clock radius, clear
  #       of the tick rings and numerals"

layouts:
  # -------------------------------------------------------------------
  # Analog: a classic three-hand dial. Quiet on purpose -- the two shared
  # registers above are its only readings.
  # -------------------------------------------------------------------
  analog:
    static:
      dial_ring:
        type: shape
        shape: arc
        at: { anchor: center }
        radius: 94%r
        thickness: 2px
        start_angle: 0deg
        sweep: 360deg
        color: config.colors.track
        lint:
          allow: [config-unsupported]
          reason: "fr955 has no native editor and keeps every declared
            default forever -- see the header comment"

      minute_ticks:
        type: pattern
        pattern: radial
        at: { anchor: center }
        count: 60
        skip_every: 5
        color: config.colors.track
        antialias: true
        lint:
          allow: [antialias-dither]
          reason: "a soft edge on the 64-colour MIP panel dithers; accepted
            so the turned ticks do not stair-step -- reported against this
            element, the first to draw anti-aliased, for the whole device"
        parts:
          - { shape: line, at: { dy: -90%r }, to: { dy: -86%r }, thickness: 1px }

      hour_ticks:
        type: pattern
        pattern: radial
        at: { anchor: center }
        count: 12
        step: 30deg
        color: config.colors.fg
        antialias: true
        parts:
          - { shape: rectangle, at: { dy: -87%r }, size: { width: 2%r, height: 6%r } }

      # Twelve numerals as one radial `shape: text` pattern part, rather
      # than twelve polar `text` elements (docs/format.md "Text parts").
      hour_numerals:
        type: pattern
        pattern: radial
        at: { anchor: center }
        count: 12
        color: config.colors.fg
        parts:
          - shape: text
            value: "(copy + 11) % 12 + 1"
            font: font.dialfont
            at: { dy: -78%r }

      bottom_card:
        type: shape
        shape: rounded_rectangle
        at: { anchor: center, dy: 30%r }
        size: { width: 42%r, height: 19%r }
        corner_radius: 3%r
        color: config.colors.dark

      bottom_icon:
        type: icon
        glyph: "U+E241"
        size: 9%r
        at: { anchor: center, dy: 45%r }
        color: config.data_color




    elements:
      bottom_data:
        type: text
        value: "activity.steps / 1000.0"
        format: "{:.1f}k" # always one decimal, so the width holds still
        # value: complication.steps
        at: { anchor: center, dy: 30%r }
        font: FONT_XTINY
        # icon_size: 9%r
        # icon_position: top
        # icon_gap: 1%r
        # icon_color: config.data_color
        color: config.colors.fg
        when_absent: placeholder
        placeholder: "--"

      top_data:
        type: group
        at: { anchor: center, dy: -20% }
        size: { width: 25%, height: 25% }
        # visible: device.notification_count > 0
        children:
          top_icon_bg:
            type: icon
            icon: notification
            size: 25%r
            at: { anchor: center, dx: 1%r, dy: 1%r }
            color: palette.black
          top_icon:
            type: icon
            icon: notification
            size: 25%r
            at: { anchor: center }
            color: config.colors.track
          top_text_bg:
            type: text
            value: device.notification_count
            format: "{:d}"
            font: FONT_TINY
            at: { anchor: center, dx: -1%r, dy: -3%r }
            color: palette.black
          top_text:
            type: text
            value: device.notification_count
            format: "{:d}"
            font: FONT_TINY
            at: { anchor: center, dy: -2%r }
            color: config.colors.bg

      analog_hands:
        type: hands
        hands: classic
        at: { anchor: center }
        seconds: awake
        antialias: true
        lint:
          allow: [antialias-dither]
          reason: "a soft edge on the 64-colour MIP panel dithers; accepted
            so the rotated hands do not stair-step"

      center_pin:
        type: shape
        shape: circle
        at: { anchor: center }
        radius: 3%r
        color: config.colors.bg

  # -------------------------------------------------------------------
  # Digital: dense and data-rich.
  # -------------------------------------------------------------------
  digital:
    static:
      sep_top:
        type: shape
        shape: line
        at: { anchor: top, dy: 24%, dx: 38% }
        to: { anchor: top, dy: 24%, dx: -38% }
        thickness: 1px
        color: config.colors.dark
        lint:
          allow: [contrast]
          reason: "a hairline rule is meant to be barely there; full contrast
            would make it compete with the data around it"

      # sep_bottom:
      #   type: shape
      #   shape: line
      #   at: { anchor: bottom, dy: -20%, dx: 33% }
      #   to: { anchor: bottom, dy: -20%, dx: -33% }
      #   thickness: 1px
      #   color: config.colors.dark
      #   lint:
      #     allow: [contrast]
      #     reason: "a hairline rule is meant to be barely there; full contrast
      #       would make it compete with the data around it"

    elements:
      date_line:
        type: text
        value: date.today
        format: "{:%a, %e %b}"
        font: FONT_XTINY
        at: { anchor: top, dy: 10% }
        color: config.colors.dim

      weather_icon:
        type: icon
        icon_for: weather.condition_today
        size: 16%r
        at: { anchor: top, dy: 20% }
        color: config.colors.fg

      # `weather.*` has no documented value range in the catalogue, so the
      # text-overflow lint sizes its box from the format's conservative
      # 5-digit fallback ("88888°", `wfb/formatting.py`'s `DEFAULT_DIGITS`)
      # rather than a realistic temperature -- centring it, rather than
      # offsetting it with `dx:`, keeps that oversized box symmetric and
      # well inside the round bezel regardless.
      weather_now:
        type: text
        value: weather.feels_like_temperature
        format: "{:d}°"
        font: FONT_XTINY
        at: { anchor: top, dy: 20%, dx: -10% }
        align: center
        color: config.colors.fg
        when_absent: placeholder
        placeholder: "--°"
        lint:
          allow: [text-overflow]
          reason: "weather.feels_like_temperature has no documented range, so
            the lint's fallback assumes 5 digits ('88888°'); a real reading
            is 1-3 digits and this box is centred with wide margin either
            side of it"

      hr_graph_icon:
        type: icon
        glyph: "U+F21E"
        size: 9%r
        at: { anchor: top, dy: 30% }
        align: center
        color: config.data_color

      center_card:
        type: shape
        shape: rounded_rectangle
        at: { anchor: center, dy: -23%r }
        size: { width: 54%r, height: 19%r }
        corner_radius: 3%r
        color: config.colors.dark

      hr_graph:
        type: graph
        series: heart_rate
        range: 4h
        style: area
        at: { anchor: center, dy: -23%r }
        size: { width: 52%r, height: 17%r }
        min: auto
        max: auto
        color: config.data_color
        on_hold: heart_rate

      hours:
        type: text
        value: time.hour
        format: "{:02d}"
        font: font.digitalclock
        at: { anchor: center, dx: -1%, dy: 7% }
        align: right
        color: config.colors.fg

      minutes:
        type: text
        value: time.minute
        format: "{:02d}"
        font: font.digitalclock
        at: { anchor: center, dx: 1%, dy: 7% }
        align: left
        color: config.accent_color

      bb_cluster:
        type: group
        size: { width: 26%r, height: 11%r }
        at: { anchor: top, dy: 75%, dx: -27% }
        align: left
        on_hold: body_battery
        children:
          hr_icon:
            type: icon
            icon: body_battery
            size: 9%r
            color: config.colors.fg
            # at: { anchor: center, dx: -30% }
            at: { anchor: left }
          hr_value:
            type: text
            value: complication.body_battery
            format: "{:d}"
            font: FONT_XTINY
            # at: { anchor: center, dx: 25% }
            at: { anchor: left, dx: 14%r }
            color: config.colors.fg
            when_absent: placeholder
            placeholder: "--"

      steps_cluster:
        type: group
        size: { width: 38%r, height: 12%r }
        at: { anchor: top, dy: 75% }
        on_hold: steps
        children:
          steps_icon:
            type: icon
            icon: steps
            size: 9%r
            color: config.colors.fg
            # at: { anchor: center, dx: -10%r }
            at: { anchor: left }
            align: left
          steps_value:
            type: text
            value: "activity.steps / 1000.0"
            format: "{:.1f}k"
            font: FONT_XTINY
            # at: { anchor: center, dx: 15%r }
            at: { anchor: left, dx: 13%r }
            align: left
            color: config.colors.fg
            when_absent: placeholder
            placeholder: "--"

      calories_cluster:
        type: group
        size: { width: 25%r, height: 12%r }
        at: { anchor: top, dy: 75%, dx: 27% }
        on_hold: calories
        align: right
        children:
          calories_icon:
            type: icon
            icon: flame
            size: 9%r
            color: config.colors.fg
            # at: { anchor: center, dx: -30% }
            at: { anchor: left }
            align: left
          calories_value:
            type: text
            value: activity.calories
            format: "{:d}"
            font: FONT_XTINY
            # at: { anchor: center, dx: 30% }
            at: { anchor: left, dx: 10%r }
            align: left
            color: config.colors.fg
            when_absent: placeholder
            placeholder: "--"

      steps_bar:
        type: progress
        style: bar
        value: activity.steps
        max: activity.step_goal
        at: { anchor: top, dy: 82% }
        size: { width: 60%, height: 3%r }
        color: config.accent_color
        track_color: config.colors.dark
        when_absent: hide

      battery_arc_l:
        type: progress
        style: arc
        value: system.battery
        max: 100
        at: { anchor: center }
        radius: 97%r
        thickness: 3%r
        start_angle: 180deg
        sweep: 30deg
        color: config.data_color
        track_color: config.colors.dark
        lint:
          allow: [safe-area]
          reason: "hugs the bezel by design, the same as a real chronograph's
            outer track -- the pen straddles the round display's own edge
            mask at this radius on every target"

      battery_arc_r:
        type: progress
        style: arc
        value: system.battery
        max: 100
        at: { anchor: center }
        radius: 97%r
        thickness: 3%r
        start_angle: 180deg
        sweep: -30deg
        color: config.data_color
        track_color: config.colors.dark
        lint:
          allow: [safe-area]
          reason: "hugs the bezel by design, the same as a real chronograph's
            outer track -- the pen straddles the round display's own edge
            mask at this radius on every target"

      charging_bolt:
        type: icon
        # icon: battery
        glyph: "U+F140B"
        size: 12%r
        at: { anchor: bottom, dy: -11%, dx: -18% }
        color: config.accent_color
        visible: system.charging
        lint:
          allow: [safe-area]
          reason: "sits on the same bezel-hugging arc as battery_arc, for
            the same reason"

      dnd_icon:
        type: icon
        icon: dnd
        size: 12%r
        at: { anchor: bottom, dy: -11%, dx: -12% }
        color: "device.do_not_disturb ? config.accent_color : config.colors.dark"

      notification_badge:
        type: icon
        icon: notification
        size: 25%r
        at: { anchor: bottom, dy: -10% }
        color: "device.notification_count > 0 ? config.accent_color : config.colors.dark"

      notification_count:
        type: text
        value: device.notification_count
        format: "{:d}"
        font: FONT_TINY
        at: { anchor: bottom, dy: -11% }
        visible: device.notification_count > 0
        color: config.colors.notify

      alarm_icon:
        type: icon
        icon: alarm
        size: 12%r
        at: { anchor: bottom, dy: -11%, dx: 12% }
        color: "device.alarm_count > 0 ? config.accent_color : config.colors.dark"

