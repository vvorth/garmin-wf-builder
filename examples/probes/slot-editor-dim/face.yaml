# Probe: does the native editor dim the whole face, or only the static layer?
#
# A test face, a variant of `examples/probes/slot-editor/face.yaml` -- read
# that header first. Named `Probe Slot Editor Dim` so the sideloaded build
# (`probe-slot-editor-dim-<device>.prg`) cannot be mistaken for anything
# else.
#
# ## What prompted it
#
# `slot-editor` on a fenix8solar47mm (2026-09-29, built from main): in some
# of the editor's frames the static `card` and `box` looked gone and the 1px
# dot ruler looked dimmer and dithered, "as if part of the dots disappear",
# while the clock and the slot readings looked normal. The generated code
# does no dimming of its own on a MIP device: the static layer is one
# full-screen buffer, blitted unchanged every frame.
#
# One explanation covers both symptoms: the editor dims what it draws, and
# on a MIP panel (no half-brightness) dimming means blacking out a share of
# the lit pixels in a pattern. `#555555` is the darkest grey the panel has,
# so a dimmed card reads as black; a 1px dot the pattern lands on is simply
# gone. Bold white strokes come through almost unchanged, so the photos
# cannot tell whether the whole face is dimmed or only the static layer.
#
# ## What is on this face
#
# Everything `slot-editor` has, plus two identical rows of swatches across
# the centre line, left to right `#555555`, `#AAAAAA`, `#FFFFFF`, `#00AAFF`:
#
# * the left row (`static_swatch_*`) is static content, painted once into
#   the same buffer as the cards;
# * the right row (`live_swatch_*`) is ordinary per-frame elements, drawn
#   like the clock.
#
# ## Plan
#
# Photograph the face once normally, then in the editor's Data step with a
# slot pulsing and with its option list open, and compare the rows:
#
# * both rows dim alike: the editor dims the whole face; platform behaviour,
#   and the fix is contrast (static cards brighter than `#555555`), or to
#   accept that they go dark only while editing;
# * only the left row dims: the editor treats the static buffer differently,
#   and `slot-editor`'s instrumentation step narrows it down;
# * the `#555555` swatch vanishes while the brighter ones only look
#   speckled: dimming, not a region being cleared.
#
# ## Answer (2026-09-29, fenix8solar47mm)
#
# **The editor dims the whole screen.** With any slot selected, both rows
# lost the `#555555` swatch and every other swatch looked dimmer too, as did
# the clock and the unselected slots' text; the cards behind slots 1 and 3
# went dark and the dot ruler thinned out. Nothing is cleared, and the static
# layer is not treated differently. A static card that must stay visible
# while editing needs a colour brighter than `#555555`.
#
# Build it with:    ./wfb.py build examples/probes/slot-editor-dim/face.yaml
# Preview it with:  ./wfb.py preview examples/probes/slot-editor-dim/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: e26c886c-01b8-4444-99ad-b81938f428da
  name: Probe Slot Editor Dim
  version: 0.1.0

build:
  targets: [fenix8solar47mm, fenix8solar51mm]
resources:
  palette:
    bg: "#000000"
    fg: "#FFFFFF"
    card: "#555555"
    dots: "#AAAAAA"
    accent: "#00AAFF"

config:
  slots:
    card:
      default: steps
      choices: [steps, heart_rate, date]
    ruler:
      default: heart_rate
      choices: [steps, heart_rate, date]
    boxed:
      default: date
      choices: [steps, heart_rate, date]

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  # the showcase register's card, exactly: partly under the slot, reaching
  # below the drawable's box
  card:
    type: rectangle
    at: { anchor: center, dx: -50%r, dy: -23%r }
    size: { width: 42%r, height: 19%r }
    corner_radius: 3%r
    color: color.card
    lint:
      allow: [contrast]
      reason: "showcase's own dark-grey card on black, reproduced exactly; the
        slot's white reading drawn on it is what has to read, not the card"

  # 1px dots every 4px around `ruler_slot`, as in `slot-editor`
  ruler_dots_upper:
    type: pattern
    pattern: grid
    at: { anchor: center, dx: -24px, dy: -84px }
    count: 360
    columns: 36
    step: { dx: 4px, dy: 4px }
    color: color.dots
    parts:
      - { type: circle, radius: 1px }
    lint:
      allow: [safe-area]
      reason: "a ruler: its top-right dots fall under the bezel and are simply
        not counted"

  ruler_dots_lower:
    type: pattern
    pattern: grid
    at: { anchor: center, dx: -24px, dy: -44px }
    count: 360
    columns: 36
    step: { dx: 4px, dy: 4px }
    color: color.dots
    parts:
      - { type: circle, radius: 1px }

  # the static row of swatches, left of centre
  static_swatch_s1:
    type: rectangle
    at: { anchor: center, dx: -80%r }
    size: { width: 9%r, height: 8%r }
    color: color.card
    lint:
      allow: [contrast]
      reason: "a swatch: its brightness under the editor is what is measured"

  static_swatch_s2:
    type: rectangle
    at: { anchor: center, dx: -70%r }
    size: { width: 9%r, height: 8%r }
    color: color.dots
    lint:
      allow: [contrast]
      reason: "a swatch: its brightness under the editor is what is measured"

  static_swatch_s3:
    type: rectangle
    at: { anchor: center, dx: -60%r }
    size: { width: 9%r, height: 8%r }
    color: color.fg
    lint:
      allow: [contrast]
      reason: "a swatch: its brightness under the editor is what is measured"

  static_swatch_s4:
    type: rectangle
    at: { anchor: center, dx: -50%r }
    size: { width: 9%r, height: 8%r }
    color: color.accent
    lint:
      allow: [contrast]
      reason: "a swatch: its brightness under the editor is what is measured"

  # a card that fully contains its slot
  box:
    type: rectangle
    at: { anchor: center, dy: 46%r }
    size: { width: 64%r, height: 20%r }
    corner_radius: 3%r
    color: color.card
    lint:
      allow: [contrast]
      reason: "the same dark-grey card as `card`, a backing, not something to read"

elements:
  # the per-frame row of swatches, right of centre, mirroring the static one
  live_swatch_s1:
    type: rectangle
    at: { anchor: center, dx: 50%r }
    size: { width: 9%r, height: 8%r }
    color: color.card
    lint:
      allow: [contrast]
      reason: "a swatch: its brightness under the editor is what is measured"

  live_swatch_s2:
    type: rectangle
    at: { anchor: center, dx: 60%r }
    size: { width: 9%r, height: 8%r }
    color: color.dots
    lint:
      allow: [contrast]
      reason: "a swatch: its brightness under the editor is what is measured"

  live_swatch_s3:
    type: rectangle
    at: { anchor: center, dx: 70%r }
    size: { width: 9%r, height: 8%r }
    color: color.fg
    lint:
      allow: [contrast]
      reason: "a swatch: its brightness under the editor is what is measured"

  live_swatch_s4:
    type: rectangle
    at: { anchor: center, dx: 80%r }
    size: { width: 9%r, height: 8%r }
    color: color.accent
    lint:
      allow: [contrast]
      reason: "a swatch: its brightness under the editor is what is measured"

  clock:
    type: text
    text: "{time.clock:%H:%M}"
    font: FONT_NUMBER_MILD
    at: { anchor: center, dy: 20%r }
    color: color.fg

  card_slot:
    type: data
    slot: card
    at: { anchor: center, dx: -50%r, dy: -30%r }
    font: FONT_XTINY
    icon: { size: 9%r, position: top, gap: 1%r, color: color.accent }
    color: color.fg
    label: none
    absent: "--"

  ruler_slot:
    type: data
    slot: ruler
    at: { anchor: center, dx: 50%r, dy: -30%r }
    font: FONT_XTINY
    icon: { size: 9%r, position: top, gap: 1%r, color: color.accent }
    color: color.fg
    label: none
    absent: "--"

  boxed_slot:
    type: data
    slot: boxed
    at: { anchor: center, dy: 46%r }
    font: FONT_XTINY
    icon: { size: 9%r, color: color.accent }
    color: color.fg
    label: short
    absent: "--"
