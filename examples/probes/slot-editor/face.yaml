# Probe: how the native on-device editor draws a `data` element.
#
# A test face, not a demo or a wearable face: it exists to answer the open
# questions below on a real fēnix 8, then be kept as the record of how they
# were answered. Named `Probe Slot Editor` so the sideloaded build
# (`probe-slot-editor-<device>.prg`) cannot be mistaken for anything else.
#
# ## The open questions
#
# In the editor's Data step, the selected slot's drawable (the generated
# `SlotDrawable`, from `getComplicationDrawable`) is animated over the face,
# and the face itself skips drawing that slot (`_pulsing`) so it is not drawn
# twice -- the SDK sample's own pattern.
#
# 1. **Why static cards vanish while editing.** Seen on showcase: the static
#    cards behind the registers went dark while a slot was selected. The
#    first guess was that the editor clears a region around the slot.
# 2. **Why the last slot goes blank at "Done".** Stepping past the last slot
#    (caption "Done", a check-mark button), that slot shows no text or icon.
#    `_pulsing` is set only by `getComplicationDrawable` and cleared only by
#    `onWatchFaceConfigEdited` with a non-complication or null `:type`; at
#    "Done" neither evidently happens, so the face keeps skipping the slot
#    and nothing else draws it. Garmin's own faces redraw it, but they are
#    firmware, not Connect IQ, so they do not show which callback to use.
#
# ## Answers so far
#
# 1. **Answered (2026-09-29, fenix8solar47mm, `slot-editor-dim`): nothing is
#    cleared; the editor dims the whole screen** while a slot is selected --
#    static and per-frame content, the clock and the other slots' text
#    alike. On the MIP panel dimming blacks out a share of lit pixels, so
#    `#555555`, the darkest grey the panel has, goes fully black (the cards
#    "vanish") and 1px dots thin out. Platform behaviour: a card that must
#    stay visible while editing needs a brighter colour than `#555555`.
# 2. **Open.** From the SDK docs alone, at "Done" either no callback fires,
#    or `onWatchFaceConfigEdited` fires with `:type` complication, which the
#    generated delegate deliberately ignores. The trace build tells them
#    apart.
#
# ## What is on this face
#
# * `card_slot` (upper left): the showcase register's exact geometry -- a
#   `data` element at `dx: -50%r, dy: -30%r` with its icon on top, and a
#   static card at `dy: -23%r` partly under the slot.
# * `ruler_slot` (upper right): the same slot with no card, inside a static
#   grid of 1px dots every 4px (`ruler_dots`), which showed the dim.
# * `boxed_slot` (bottom): a static card that fully contains its slot. It
#   is the last slot, so it is the one that goes blank at "Done".
# * A clock, so the face is recognisable.
#
# Only the two fēnix 8 verification devices are targets: the question is
# about the native editor, which fr955 does not have (it edits `config:`
# from the generated settings menu instead).
#
# ## The trace build
#
# `trace.py` beside this file builds `Probe Slot Editor Trace`: this face
# with `EditorTrace.mc` patched into the generated code, drawing what the
# editor calls on the face itself, in place of the clock, so a photo is the
# log (no log file to create on the watch). What each line and event code
# means is in `EditorTrace.mc`. It installs beside this probe, never
# replacing it, and never touches an ordinary build.
#
#     ./.venv/bin/python examples/probes/slot-editor/trace.py
#     # -> build/trace/probe-slot-editor/probe-slot-editor-trace-<device>.prg
#
# One run, photographing each step: face -> editor -> Data -> slot 1 ->
# slot 2 -> slot 3 -> "Done", then a few seconds later "Done" again (does
# `U` still count up, i.e. does the editor keep redrawing the face?), then
# back to slot 3, open its option list, scroll, cancel.
#
# Then decide from the photos: if a callback marks "Done", clear `_pulsing`
# there; if nothing does but the face keeps being redrawn, skip a slot only
# while its drawable is still being drawn (`D`'s age tells how often the
# editor draws it).
#
# Build it with:    ./wfb.py build examples/probes/slot-editor/face.yaml
# Preview it with:  ./wfb.py preview examples/probes/slot-editor/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 7f3c1e58-2b9a-4d6e-8c05-1a9e4f7b2d63
  name: Probe Slot Editor
  version: 0.1.0

build:
  targets: [fenix8solar47mm, fenix8solar51mm]
resources:
  palette:
    bg: "#000000"
    fg: "#FFFFFF"
    card: "#555555"
    dots: "#AAAAAA"
    accent: "#00AAFF"

config:
  slots:
    card:
      default: steps
      choices: [steps, heart_rate, date]
    ruler:
      default: heart_rate
      choices: [steps, heart_rate, date]
    boxed:
      default: date
      choices: [steps, heart_rate, date]

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  # the showcase register's card, exactly: partly under the slot, reaching
  # below the drawable's box
  card:
    type: rectangle
    at: { anchor: center, dx: -50%r, dy: -23%r }
    size: { width: 42%r, height: 19%r }
    corner_radius: 3%r
    color: color.card
    lint:
      allow: [contrast]
      reason: "showcase's own dark-grey card on black, reproduced exactly; the
        slot's white reading drawn on it is what has to read, not the card"

  # 1px dots every 4px around `ruler_slot`, in plain pixels from the centre
  # so they can be counted: 36 columns from 24px left of the centre to 116px
  # right of it, 20 rows from 84px above it to 8px above it -- two stacked
  # grids, because a pattern draws at most 360 copies. The slot's drawable
  # box already spans the whole right half of the screen, so the ruler
  # reaches past the centre line and well above and below the slot. Built
  # to trace a cleared region; the dots instead thinned out everywhere,
  # which is the editor's whole-screen dim.
  ruler_dots_upper:
    type: pattern
    pattern: grid
    at: { anchor: center, dx: -24px, dy: -84px }
    count: 360
    columns: 36
    step: { dx: 4px, dy: 4px }
    color: color.dots
    parts:
      - { type: circle, radius: 1px }
    lint:
      allow: [safe-area]
      reason: "a ruler: its top-right dots fall under the bezel and are simply
        not counted"

  ruler_dots_lower:
    type: pattern
    pattern: grid
    at: { anchor: center, dx: -24px, dy: -44px }
    count: 360
    columns: 36
    step: { dx: 4px, dy: 4px }
    color: color.dots
    parts:
      - { type: circle, radius: 1px }

  # a card that fully contains its slot
  box:
    type: rectangle
    at: { anchor: center, dy: 46%r }
    size: { width: 64%r, height: 20%r }
    corner_radius: 3%r
    color: color.card
    lint:
      allow: [contrast]
      reason: "the same dark-grey card as `card`, a backing, not something to read"

elements:
  clock:
    type: text
    text: "{time.clock:%H:%M}"
    font: FONT_NUMBER_MILD
    at: { anchor: center, dy: 20%r }
    color: color.fg

  card_slot:
    type: data
    slot: card
    at: { anchor: center, dx: -50%r, dy: -30%r }
    font: FONT_XTINY
    icon: { size: 9%r, position: top, gap: 1%r, color: color.accent }
    color: color.fg
    label: none
    absent: "--"

  ruler_slot:
    type: data
    slot: ruler
    at: { anchor: center, dx: 50%r, dy: -30%r }
    font: FONT_XTINY
    icon: { size: 9%r, position: top, gap: 1%r, color: color.accent }
    color: color.fg
    label: none
    absent: "--"

  boxed_slot:
    type: data
    slot: boxed
    at: { anchor: center, dy: 46%r }
    font: FONT_XTINY
    icon: { size: 9%r, color: color.accent }
    color: color.fg
    label: short
    absent: "--"
