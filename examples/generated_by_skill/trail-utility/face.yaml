# Trail Utility -- a dense digital tool face with angular frame lines,
# modelled on a picture of an outdoor watch (reference.png): two-tone
# hours/minutes with seconds, sunrise/sunset, and six spots the wearer
# picks on the watch (config: slots:), each drawn with what suits it:
#
# * top_left / top_right: an arc across the top, filled against the
#   pick's own scale, with its icon and reading below it;
# * weather: the reading with its icon, which follows the weather;
# * ring: a full ring round the reading on the right (battery by default);
# * graph: bars of the pick's history (heart rate over 4 hours by default);
# * bottom: one reading with its icon under the graph.
#
# Every font is one the watch already has (a vector face, so it scales):
# Bionic for the time, Roboto Condensed for everything else. The accent
# colour is the wearer's to change. The original's model-name wordmark is
# replaced by the face's own name.
#
# Preview:  ./wfb preview examples/generated_by_skill/trail-utility/face.yaml --time 10:10:38
# Build:    ./wfb build examples/generated_by_skill/trail-utility/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: ffbf5db6-078b-43c7-9eb7-ed4e4750bcf8
  name: Trail Utility
  version: 2.0.0

build:
  targets: [fenix8solar47mm, fenix8solar51mm, fr955]

resources:
  fonts:
    clock: { face: [BionicSemiBold, BionicBold, RobotoCondensedBold], size: 66%r }
    seconds: { face: [BionicSemiBold, BionicBold, RobotoCondensedBold], size: 20%r }
    small: { face: [RobotoCondensedRegular], size: 14.5%r }
    label: { face: [RobotoCondensedBold], size: 13%r }
  palette:                          # every channel 00 / 55 / AA / FF
    bg: "#000000"
    fg: "#AAAAAA"
    track: "#555555"
    frame: "#555555"

config:
  accent_color:
    default: "#AAFF00"
    choices: any
  slots:
    top_left:
      label: "Top left"
      default: body_battery
      choices: [body_battery, stress, battery, steps, floors_climbed, intensity_minutes, recovery_time]
    top_right:
      label: "Top right"
      default: steps
      choices: [steps, calories, floors_climbed, intensity_minutes, body_battery, stress, battery]
    weather:
      label: "Weather"
      default: current_temperature
      choices: [current_temperature, high_low_temperature, altitude, sea_level_pressure]
    ring:
      label: "Ring"
      default: battery
      choices: [battery, body_battery, stress, pulse_ox, steps]
    graph:
      label: "Graph"
      default: heart_rate
      choices: [heart_rate, steps, calories, floors_climbed, intensity_minutes, current_temperature]
    bottom:
      label: "Bottom"
      default: solar_input
      choices: [solar_input, battery, body_battery, stress, steps, calories, floors_climbed, intensity_minutes, heart_rate, altitude, notification_count, recovery_time]

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  divider: { type: line, at: { anchor: center, dx: -1%r, dy: -80%r }, to: { anchor: center, dx: -1%r, dy: -59%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast], reason: "a dim divider, decoration only" } }
  frame_top:
    type: group
    children:
      ft1: { type: line, at: { anchor: center, dx: -71.8%r, dy: -69.4%r }, to: { anchor: center, dx: -56.3%r, dy: -55.1%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast, safe-area], reason: "dim frame line, decoration only; it ends at the screen edge on purpose" } }
      ft2: { type: line, at: { anchor: center, dx: -56.3%r, dy: -55.1%r }, to: { anchor: center, dx: 56.8%r, dy: -55.1%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast], reason: "dim frame line, decoration only" } }
      ft3: { type: line, at: { anchor: center, dx: 56.8%r, dy: -55.1%r }, to: { anchor: center, dx: 73%r, dy: -69.4%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast, safe-area], reason: "dim frame line, decoration only; it ends at the screen edge on purpose" } }
  frame_sun:
    type: group
    children:
      fs1: { type: line, at: { anchor: center, dx: -82.6%r, dy: -46.5%r }, to: { anchor: center, dx: 11%r, dy: -46.5%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast, safe-area], reason: "dim frame line, decoration only; it ends at the screen edge on purpose" } }
      fs2: { type: line, at: { anchor: center, dx: 11%r, dy: -46.5%r }, to: { anchor: center, dx: 25%r, dy: -27%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast], reason: "dim frame line, decoration only" } }
      fs3: { type: line, at: { anchor: center, dx: 25%r, dy: -27%r }, to: { anchor: center, dx: 85%r, dy: -27%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast, safe-area], reason: "dim frame line, decoration only; it ends at the screen edge on purpose" } }
  frame_date:
    type: group
    children:
      fd1: { type: line, at: { anchor: center, dx: -85%r, dy: 44%r }, to: { anchor: center, dx: -38%r, dy: 44%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast, safe-area], reason: "dim frame line, decoration only; it ends at the screen edge on purpose" } }
      fd2: { type: line, at: { anchor: center, dx: -38%r, dy: 44%r }, to: { anchor: center, dx: -29%r, dy: 26%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast], reason: "dim frame line, decoration only" } }
      fd3: { type: line, at: { anchor: center, dx: -29%r, dy: 26%r }, to: { anchor: center, dx: 42%r, dy: 26%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast], reason: "dim frame line, decoration only" } }
  frame_graph:
    type: group
    children:
      fg1: { type: line, at: { anchor: center, dx: -73%r, dy: 68%r }, to: { anchor: center, dx: -61%r, dy: 52%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast, safe-area], reason: "dim frame line, decoration only; it ends at the screen edge on purpose" } }
      fg2: { type: line, at: { anchor: center, dx: -61%r, dy: 52%r }, to: { anchor: center, dx: 61%r, dy: 52%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast], reason: "dim frame line, decoration only" } }
      fg3: { type: line, at: { anchor: center, dx: 61%r, dy: 52%r }, to: { anchor: center, dx: 73%r, dy: 68%r }, thickness: 2px, color: color.frame, lint: { allow: [contrast, safe-area], reason: "dim frame line, decoration only; it ends at the screen edge on purpose" } }
  ring_outer: { type: circle, filled: false, at: { anchor: center, dx: 67%r, dy: 3%r }, radius: 29%r, thickness: 3px, color: color.frame, lint: { allow: [contrast], reason: "dim bezel round the ring, decoration only" } }
  name_label: { type: text, text: "TRAIL", font: font.label, at: { anchor: center, dx: 6%r, dy: 35.5%r }, color: color.fg }
  sunrise_icon: { type: icon, icon: sunrise, size: 14%r, at: { anchor: center, dx: -40.5%r, dy: -37%r }, color: color.fg }

elements:
  # --- top: two arcs that fill toward 12 o'clock, each a slot ---
  top_left_slot:
    type: group
    children:
      top_left_arc:
        lint: { allow: [safe-area], reason: "the top arcs follow the screen edge by design" }
        type: gauge
        slot: top_left
        style: arc
        at: { anchor: center }
        radius: 94%r
        thickness: 6%r
        start_angle: 316deg
        sweep: 43deg
        color: color.accent
        track_color: color.track
        absent: hide
      top_left_value:
        type: data
        slot: top_left
        font: font.small
        icon: { size: 18%r, gap: 2%r, color: color.fg }
        at: { anchor: center, dx: -50%r, dy: -68%r }
        align: left
        color: color.fg
        absent: { text: "--" }
        on_hold: auto
  top_right_slot:
    type: group
    children:
      top_right_arc:
        lint: { allow: [safe-area], reason: "the top arcs follow the screen edge by design" }
        type: gauge
        slot: top_right
        style: arc
        at: { anchor: center }
        radius: 94%r
        thickness: 6%r
        start_angle: 44deg
        sweep: -43deg
        color: color.accent
        track_color: color.track
        absent: hide
      top_right_value:
        type: data
        slot: top_right
        font: font.small
        icon: { size: 15%r, gap: 3%r, color: color.fg }
        at: { anchor: center, dx: 5%r, dy: -68%r }
        align: left
        color: color.fg
        absent: { text: "--" }
        on_hold: auto

  # --- sunrise / sunset ---
  sunrise:
    type: text
    text: "{complication.sunrise:%H:%M}"
    font: font.small
    at: { anchor: center, dx: -49%r, dy: -36.5%r }
    align: right
    color: color.fg
    absent: { text: "--:--" }
  sunset:
    type: text
    text: "{complication.sunset:%H:%M}"
    font: font.small
    at: { anchor: center, dx: -30%r, dy: -36.5%r }
    align: left
    color: color.fg
    absent: { text: "--:--" }

  # --- weather slot ---
  weather_value:
    type: data
    slot: weather
    font: font.small
    short: true
    icon: { size: 17%r, gap: 5%r, color: color.fg }
    at: { anchor: center, dx: 70%r, dy: -37%r }
    align: right
    color: color.fg
    absent: { text: "--" }
    on_hold: auto

  # --- time ---
  # Bionic SemiBold is the boldest Bionic the fenix 8 has, lighter than
  # the picture's digits: a 1 px outline in the digit's own colour thickens
  # each stroke by a pixel all round.
  hours:
    lint: { allow: [contrast, text-outline-interior], reason: "the outline is the digit's own colour on purpose: it emboldens the glyph rather than ringing it" }
    type: text
    text: "{time.clock:%H}"
    font: font.clock
    at: { anchor: center, dx: -34%r, dy: -1.5%r }
    align: right
    color: color.fg
    outline: { color: color.fg }
  minutes:
    lint: { allow: [text-outline-interior], reason: "the outline is the digit's own colour on purpose: it emboldens the glyph rather than ringing it" }
    type: text
    text: "{time.clock:%M}"
    font: font.clock
    at: { anchor: center, dx: -33%r, dy: -1.5%r }
    align: left
    color: color.accent
    outline: { color: color.accent }
  seconds:
    type: text
    text: "{time.second:02d}"
    font: font.seconds
    at: { anchor: center, dx: 21.5%r, dy: -12.5%r }
    align: left
    color: color.fg

  # --- the ring slot ---
  ring_slot:
    type: group
    at: { anchor: center, dx: 67%r, dy: 3%r }
    size: { width: 52%r, height: 52%r }
    on_hold: auto
    children:
      ring_gauge:
        type: gauge
        slot: ring
        style: arc
        at: { anchor: center }
        radius: 25.5%r
        thickness: 3%r
        start_angle: 0deg
        sweep: 360deg
        color: color.accent
        track_color: color.track
        absent: hide
      ring_icon: { type: icon, slot: ring, size: 14%r, at: { anchor: center, dy: -7%r }, color: color.fg }
      ring_value:
        type: data
        slot: ring
        font: font.small
        unit: true
        at: { anchor: center, dy: 9%r }
        color: color.fg
        absent: { text: "--" }

  # --- date ---
  date:
    type: text
    text: "{(date.weekday == 1 ? \"SUN\" : (date.weekday == 2 ? \"MON\" : (date.weekday == 3 ? \"TUE\" : (date.weekday == 4 ? \"WED\" : (date.weekday == 5 ? \"THU\" : (date.weekday == 6 ? \"FRI\" : \"SAT\"))))))} {date.today:%d}"
    font: font.small
    at: { anchor: center, dx: -59%r, dy: 34.5%r }
    color: color.fg

  # --- graph slot ---
  graph:
    type: graph
    slot: graph
    style: bars
    buckets: 48
    bar_width: 2px
    at: { anchor: center, dy: 67%r }
    size: { width: 116%r, height: 20%r }
    color: color.accent
    on_hold: auto

  # --- bottom slot ---
  bottom_value:
    type: data
    slot: bottom
    font: font.small
    icon: { size: 13%r, gap: 3%r, color: color.fg }
    at: { anchor: center, dx: -1%r, dy: 86.5%r }
    color: color.fg
    absent: { text: "--" }
    on_hold: auto
