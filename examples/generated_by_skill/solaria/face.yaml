? 304 : 334) + date.day + ((((date.year % 4 == 0 and date.year % 100 != 0) or date.year % 400 == 0) and date.month != "Jan" and date.month != "Feb") ? 1 : 0)) - ((date.weekday + 5) % 7 + 1) + 10) / 7)):d} D{((date.weekday + 5) % 7 + 1):d}'
        font: font.t7
        at: { anchor: center, dy: 11%r }
        color: color.green
  date_hand:
    type: gauge
    style: needle
    value: date.day - 1
    max: 30
    at: { anchor: center, dy: -57%r }
    start_angle: 0deg
    sweep: 348.387deg
    color: color.red
    needle:
      blade: { type: line, at: { dy: 4%r }, to: { dy: -23%r }, thickness: 2px }
      hub: { type: circle, radius: 1.5%r }
  week_hand:
    type: gauge
    style: needle
    value: '(floor((((date.month == "Jan" ? 0 : date.month == "Feb" ? 31 : date.month == "Mar" ? 59 : date.month == "Apr" ? 90 : date.month == "May" ? 120 : date.month == "Jun" ? 151 : date.month == "Jul" ? 181 : date.month == "Aug" ? 212 : date.month == "Sep" ? 243 : date.month == "Oct" ? 273 : date.month == "Nov" ? 304 : 334) + date.day + ((((date.year % 4 == 0 and date.year % 100 != 0) or date.year % 400 == 0) and date.month != "Jan" and date.month != "Feb") ? 1 : 0)) - ((date.weekday + 5) % 7 + 1) + 10) / 7) < 1 ? ((((1 + 5 * ((date.year - 1 - 1) % 4) + 4 * ((date.year - 1 - 1) % 100) + 6 * ((date.year - 1 - 1) % 400)) % 7) == 4 or ((((date.year - 1) % 4 == 0 and (date.year - 1) % 100 != 0) or (date.year - 1) % 400 == 0) and ((1 + 5 * ((date.year - 1 - 1) % 4) + 4 * ((date.year - 1 - 1) % 100) + 6 * ((date.year - 1 - 1) % 400)) % 7) == 3)) ? 53 : 52) : (floor((((date.month == "Jan" ? 0 : date.month == "Feb" ? 31 : date.month == "Mar" ? 59 : date.month == "Apr" ? 90 : date.month == "May" ? 120 : date.month == "Jun" ? 151 : date.month == "Jul" ? 181 : date.month == "Aug" ? 212 : date.month == "Sep" ? 243 : date.month == "Oct" ? 273 : date.month == "Nov" ? 304 : 334) + date.day + ((((date.year % 4 == 0 and date.year % 100 != 0) or date.year % 400 == 0) and date.month != "Jan" and date.month != "Feb") ? 1 : 0)) - ((date.weekday + 5) % 7 + 1) + 10) / 7) == 53 and not (((1 + 5 * ((date.year - 1) % 4) + 4 * ((date.year - 1) % 100) + 6 * ((date.year - 1) % 400)) % 7) == 4 or ((((date.year) % 4 == 0 and (date.year) % 100 != 0) or (date.year) % 400 == 0) and ((1 + 5 * ((date.year - 1) % 4) + 4 * ((date.year - 1) % 100) + 6 * ((date.year - 1) % 400)) % 7) == 3))) ? 1 : floor((((date.month == "Jan" ? 0 : date.month == "Feb" ? 31 : date.month == "Mar" ? 59 : date.month == "Apr" ? 90 : date.month == "May" ? 120 : date.month == "Jun" ? 151 : date.month == "Jul" ? 181 : date.month == "Aug" ? 212 : date.month == "Sep" ? 243 : date.month == "Oct" ? 273 : date.month == "Nov" ? 304 : 334) + date.day + ((((date.year % 4 == 0 and date.year % 100 != 0) or date.year % 400 == 0) and date.month != "Jan" and date.month != "Feb") ? 1 : 0)) - ((date.weekday + 5) % 7 + 1) + 10) / 7)) - 1'
