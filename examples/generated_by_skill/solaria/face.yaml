# Solaria -- every front-dial indication of the Vacheron Constantin Les
# Cabinotiers Solaria Ultra Grand Complication that a Garmin watch face can
# compute from the clock, the calendar and the sunrise/sunset complications.
#
# Generated by gen.py beside this file (the astronomical expressions are
# shared fragments there); edit the generator, then rerun it.
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 7eacd6b4-4002-419b-a30c-c657db09743c
  name: Solaria
  version: 1.0.0

build:
  targets: [fenix8solar47mm, fenix8solar51mm]

resources:
  palette:
    bg: "#000000"
    white: "#FFFFFF"
    grey: "#AAAAAA"
    dim: "#555555"
    gold: "#FFAA00"
    red: "#FF0000"
    green: "#00AA55"

  fonts:
    t7: { face: [RobotoCondensedBold], size: 7%r }
    t8: { face: [RobotoCondensedBold], size: 8%r }
    t9: { face: [RobotoCondensedBold], size: 9%r }

  hand_sets:
    main:
      hour:
        color: color.white
        parts:
          blade:
            # a baton: a slim stem, then a parallel blade to a pointed tip
            type: polygon
            mirror: x
            points:
              - { dx: -1.3%r, dy: 8%r }
              - { dx: -1.3%r, dy: -12%r }
              - { dx: -2.8%r, dy: -17%r }
              - { dx: -2.8%r, dy: -50%r }
              - { dy: -58%r }
          facet:
            type: polygon
            mirror: x
            color: color.dim
            points:
              - { dx: -0.9%r, dy: -18%r }
              - { dx: -0.9%r, dy: -49%r }
              - { dy: -53%r }
      minute:
        color: color.white
        parts:
          blade:
            type: polygon
            mirror: x
            points:
              - { dx: -1.2%r, dy: 8%r }
              - { dx: -1.2%r, dy: -14%r }
              - { dx: -2.5%r, dy: -19%r }
              - { dx: -2.5%r, dy: -78%r }
              - { dy: -86%r }
          facet:
            type: polygon
            mirror: x
            color: color.dim
            points:
              - { dx: -0.8%r, dy: -20%r }
              - { dx: -0.8%r, dy: -77%r }
              - { dy: -81%r }

# ----------------------------------------------------------------------------
# Fixed furniture: drawn once into the static buffer.
static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  # -- periphery: a 24-hour sun dial, midnight at the bottom, noon at the top --
  rim_ring:
    type: circle
    at: { anchor: center }
    radius: 95%r
    filled: false
    thickness: 5.5%r
    color: color.white
  rim_hours:
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 24
    start: 180deg
    color: color.white
    parts:
      tick: { type: line, at: { dy: -93.5%r }, to: { dy: -91%r }, thickness: 1px }
  rim_numerals:
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 12
    start: 180deg
    skip: [0]
    color: color.bg
    lint: { allow: [contrast, safe-area, off-screen], reason: "black on the white ring beneath, which the lint does not see; the numerals' box corners cross the rim, their ink does not" }
    parts:
      numeral:
        type: text
        text: "{copy * 2}"
        font: font.t7
        at: { dy: -94%r }

  # -- 12 o'clock: perpetual calendar ------------------------------------------
  cal_ring:
    type: circle
    at: { anchor: center, dy: -57%r }
    radius: 25.5%r
    filled: false
    thickness: 8.5%r
    color: color.white
  cal_week_ring:
    type: circle
    at: { anchor: center, dy: -57%r }
    radius: 31.5%r
    filled: false
    thickness: 1px
    color: color.dim
    lint: { allow: [contrast], reason: "subdued by design: a night tone, not a reading" }
  cal_week_marks:
    type: pattern
    pattern: radial
    at: { anchor: center, dy: -57%r }
    count: 4
    color: color.green
    parts:
      tick: { type: line, at: { dy: -30.5%r }, to: { dy: -32.5%r }, thickness: 2px }
  cal_ticks:
    type: pattern
    pattern: radial
    at: { anchor: center, dy: -57%r }
    count: 31
    step_angle: 11.6129deg
    color: color.bg
    parts:
      tick: { type: line, at: { dy: -29.75%r }, to: { dy: -27.5%r }, thickness: 1px }
  cal_numerals:
    type: pattern
    pattern: radial
    at: { anchor: center, dy: -57%r }
    count: 6
    start: 46.4516deg
    step_angle: 58.0645deg
    color: color.bg
    lint: { allow: [contrast], reason: "black on the white ring beneath, which the lint does not see" }
    parts:
      numeral: { type: text, text: "{copy * 5 + 5}", font: font.t7, at: { dy: -24.5%r } }
  cal_one:
    type: text
    text: "1"
    font: font.t7
    at: { anchor: center, dy: -81.5%r }
    color: color.bg
    lint: { allow: [contrast], reason: "black on the white ring beneath, which the lint does not see" }

  # -- 3 o'clock: second time zone, 24 h, midnight at the top ------------------
  tz_night:
    type: arc
    at: { anchor: center, dx: 43.5%r, dy: -10%r }
    radius: 23%r
    thickness: 6.5%r
    start_angle: 270deg
    sweep: 180deg
    color: color.dim
    lint: { allow: [contrast], reason: "subdued by design: a night tone, not a reading" }
  tz_day:
    type: arc
    at: { anchor: center, dx: 43.5%r, dy: -10%r }
    radius: 23%r
    thickness: 6.5%r
    start_angle: 90deg
    sweep: 180deg
    color: color.white
  tz_ticks:
    type: pattern
    pattern: radial
    at: { anchor: center, dx: 43.5%r, dy: -10%r }
    count: 12
    color: color.grey
    parts:
      tick: { type: line, at: { dy: -19%r }, to: { dy: -17%r }, thickness: 1px }
  tz_numerals:
    # even hours on the ring: white over the night half, black over the day half
    type: pattern
    pattern: radial
    at: { anchor: center, dx: 43.5%r, dy: -10%r }
    count: 12
    skip: [3, 9]
    color: "copy > 3 and copy < 9 ? color.bg : color.white"
    lint: { allow: [contrast], reason: "black on the white ring beneath, which the lint does not see" }
    parts:
      numeral: { type: text, text: "{(copy == 0 ? 24 : copy * 2)}", font: font.t7, at: { dy: -23%r } }
  tz_6: { type: text, text: "6", font: font.t7, at: { anchor: center, dx: 20.5%r, dy: -10%r }, color: color.gold }
  tz_18: { type: text, text: "18", font: font.t7, at: { anchor: center, dx: 66.5%r, dy: -10%r }, color: color.gold }

  # -- 9 o'clock: moon age scale, tide ----------------------------------------
  moon_scale:
    type: arc
    at: { anchor: center, dx: -43.5%r, dy: -10%r }
    radius: 24.5%r
    thickness: 3%r
    start_angle: 285deg
    sweep: 150deg
    color: color.white
  moon_scale_ticks:
    type: pattern
    pattern: radial
    at: { anchor: center, dx: -43.5%r, dy: -10%r }
    count: 7
    start: 285deg
    step_angle: 25deg
    color: color.bg
    parts:
      tick: { type: line, at: { dy: -26%r }, to: { dy: -23%r }, thickness: 1px }
  moon_0: { type: text, text: "0", font: font.t7, at: { anchor: center, dx: -72.5%r, dy: -17.8%r }, color: color.grey }
  moon_15: { type: text, text: "15", font: font.t7, at: { anchor: center, dx: -43.5%r, dy: -40.0%r }, color: color.grey }
  moon_29: { type: text, text: "29", font: font.t7, at: { anchor: center, dx: -14.5%r, dy: -17.8%r }, color: color.grey }
  tide_high: { type: text, text: "HIGH", font: font.t7, at: { anchor: center, dx: -43.5%r, dy: -1.5%r }, color: color.grey }
  tide_low: { type: text, text: "LOW", font: font.t7, at: { anchor: center, dx: -43.5%r, dy: 20%r }, color: color.grey }
  tide_ring:
    type: circle
    at: { anchor: center, dx: -43.5%r, dy: 9%r }
    radius: 6%r
    filled: false
    thickness: 1px
    color: color.dim
    lint: { allow: [contrast], reason: "subdued by design: a night tone, not a reading" }

  # -- 6 o'clock: solar counter ----------------------------------------------
  eot_scale:
    type: arc
    at: { anchor: center, dy: 44%r }
    radius: 26%r
    thickness: 1.5%r
    start_angle: 300deg
    sweep: 120deg
    color: color.white
  eot_ticks:
    type: pattern
    pattern: radial
    at: { anchor: center, dy: 44%r }
    count: 3
    start: 300deg
    step_angle: 60deg
    color: color.white
    parts:
      tick: { type: line, at: { dy: -27%r }, to: { dy: -24%r }, thickness: 1px }
  eot_minus: { type: text, text: "-16", font: font.t7, at: { anchor: center, dx: -16.2%r, dy: 37.4%r }, color: color.grey }
  eot_plus: { type: text, text: "+14", font: font.t7, at: { anchor: center, dx: 16.2%r, dy: 37.4%r }, color: color.grey }
  eot_label:
    type: text
    text: "EQUATION"
    font: font.t7
    at: { anchor: center, dy: 44%r }
    color: color.grey
    curve: { style: radial, angle: 0deg, radius: 29.5%r, direction: clockwise }
  dec_scale:
    type: arc
    at: { anchor: center, dy: 44%r }
    radius: 26%r
    thickness: 1.5%r
    start_angle: 65deg
    sweep: 60deg
    color: color.red
  dec_ticks:
    type: pattern
    pattern: radial
    at: { anchor: center, dy: 44%r }
    count: 3
    start: 65deg
    step_angle: 30deg
    color: color.red
    parts:
      tick: { type: line, at: { dy: -27%r }, to: { dy: -24%r }, thickness: 1px }
  dec_s: { type: text, text: "S", font: font.t7, at: { anchor: center, dx: 19.1%r, dy: 31.1%r }, color: color.red }
  dec_n: { type: text, text: "N", font: font.t7, at: { anchor: center, dx: 17.7%r, dy: 59.4%r }, color: color.red }
  earth:
    type: circle
    at: { anchor: center, dy: 44%r }
    radius: 6.5%r
    color: color.grey
  earth_meridian:
    type: line
    at: { anchor: center, dy: 37.5%r }
    to: { anchor: center, dy: 50.5%r }
    thickness: 1px
    color: color.dim
    lint: { allow: [contrast], reason: "subdued by design: a night tone, not a reading" }
  dec_label:
    type: text
    text: "DECL"
    font: font.t7
    at: { anchor: center, dy: 44%r }
    color: color.grey
    curve: { style: radial, angle: 97deg, radius: 29.5%r, direction: clockwise }
  culm_label:
    type: text
    text: "CULM"
    font: font.t7
    at: { anchor: center, dy: 44%r }
    color: color.grey
    curve: { style: radial, angle: 232deg, radius: 29.5%r, direction: counter_clockwise }
  sid_label: { type: text, text: "SIDEREAL", font: font.t7, at: { anchor: center, dx: -58%r, dy: 31%r }, color: color.grey }
  res_label: { type: text, text: "RESERVE", font: font.t7, at: { anchor: center, dx: 58%r, dy: 31%r }, color: color.grey }

# ----------------------------------------------------------------------------
elements:
  # -- periphery: night over the gold band, sunrise/sunset pointers, the sun --
  night_before_sunrise:
    # midnight to sunrise, painted over the static white ring (no track of its own)
    type: gauge
    style: arc
    value: 'complication.sunrise'
    max: 86400
    at: { anchor: center }
    radius: 95%r
    thickness: 5.5%r
    start_angle: 180deg
    sweep: 360deg
    color: color.dim
    absent: hide
    lint: { allow: [contrast], reason: "subdued by design: a night tone, not a reading" }
  night_after_sunset:
    type: gauge
    style: arc
    value: '86400 - complication.sunset'
    max: 86400
    at: { anchor: center }
    radius: 95%r
    thickness: 5.5%r
    start_angle: 180deg
    sweep: -360deg
    color: color.dim
    absent: hide
    lint: { allow: [contrast], reason: "subdued by design: a night tone, not a reading" }
  rim_night_numerals:
    # the even hours that fall in the night, white over the grey sector (the
    # static black copies underneath are covered exactly)
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 12
    start: 180deg
    skip: [0]
    color: color.white
    absent: hide
    lint: { allow: [safe-area, off-screen], reason: "the numerals' box corners cross the rim, their ink does not" }
    parts:
      numeral:
        type: text
        text: "{copy * 2}"
        font: font.t7
        at: { dy: -94%r }
        visible: 'copy * 7200 < complication.sunrise or copy * 7200 >= complication.sunset'
  sunrise_pointer:
    type: gauge
    style: needle
    value: 'complication.sunrise'
    max: 86400
    at: { anchor: center }
    start_angle: 180deg
    sweep: 360deg
    color: color.gold
    absent: { value: 0.25 }
    needle:
      tip:
        type: polygon
        points: [{ dx: -2.2%r, dy: -85%r }, { dy: -90.5%r }, { dx: 2.2%r, dy: -85%r }]
  sunset_pointer:
    type: gauge
    style: needle
    value: 'complication.sunset'
    max: 86400
    at: { anchor: center }
    start_angle: 180deg
    sweep: 360deg
    color: color.gold
    absent: { value: 0.75 }
    needle:
      tip:
        type: polygon
        points: [{ dx: -2.2%r, dy: -85%r }, { dy: -90.5%r }, { dx: 2.2%r, dy: -85%r }]
  sun_position:
    type: gauge
    style: needle
    value: time.hour * 3600 + time.minute * 60
    max: 86400
    at: { anchor: center }
    start_angle: 180deg
    sweep: 360deg
    color: color.gold
    needle:
      sun: { type: circle, at: { dy: -94.5%r }, radius: 2.5%r }
      sun_rim: { type: circle, at: { dy: -94.5%r }, radius: 3.1%r, filled: false, thickness: 1px, color: color.bg }
  sun_night:
    # painted over the gold sun between sunset and sunrise: day/night for the reference city
    type: gauge
    style: needle
    value: time.hour * 3600 + time.minute * 60
    max: 86400
    at: { anchor: center }
    start_angle: 180deg
    sweep: 360deg
    color: color.bg
    visible: 'not (time.hour * 3600 + time.minute * 60 + time.second >= complication.sunrise and time.hour * 3600 + time.minute * 60 + time.second < complication.sunset)'
    needle:
      sun: { type: circle, at: { dy: -94.5%r }, radius: 2.5%r }
      sun_rim: { type: circle, at: { dy: -94.5%r }, radius: 3.1%r, filled: false, thickness: 1px, color: color.white }
    lint: { allow: [contrast], reason: "subdued by design: a night tone, not a reading" }

  # -- 12 o'clock: perpetual calendar ------------------------------------------
  calendar:
    type: group
    at: { anchor: center, dy: -57%r }
    size: { width: 44%r, height: 44%r }
    on_hold: date
    children:
      year: { type: text, text: "{date.year:d}", font: font.t8, at: { anchor: center, dx: -3%r, dy: -12%r }, color: color.white }
      leap:
        type: text
        text: "LY"
        font: font.t7
        at: { anchor: center, dx: 13%r, dy: -12%r }
        color: color.green
        visible: '((date.year % 4 == 0 and date.year % 100 != 0) or date.year % 400 == 0)'
      weekday: { type: text, text: "{date.today:%a}", font: font.t8, at: { anchor: center, dx: -10.5%r }, color: color.white }
      month: { type: text, text: "{date.today:%b}", font: font.t8, at: { anchor: center, dx: 10.5%r }, color: color.white }
