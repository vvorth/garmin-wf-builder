# A worked example for `type: graph` -- a time series drawn as a line, a
# filled area, or bars, over a data source and a range the author declares.
#
# Build it with:  ./wfb.py build examples/graph/face.yaml
#
# All three drawing styles, over three of the four series families a watch
# face may plot (`wfb series` lists all of them): a 4-hour heart-rate line,
# time-binned by the compiler at runtime because heart rate's own sample
# interval is device dependent; a 7-day steps bar chart, converted from a
# duration to a sample count at *build* time because
# `ActivityMonitor.getHistory()` is a short, bounded array; and a 24-hour
# forecast-temperature filled area, from the fourth acquisition family
# (`Weather.getHourlyForecast()`, whose array is itself nullable). None of
# the three needs a permission. Nothing backed by `Toybox.SensorHistory` --
# pressure, stress, elevation, Body Battery as a history -- or solar is
# available to a watch face at all; see docs/limitations.md and
# docs/research/08-graphs-and-configuration.md §1.
#
# yaml-language-server: $schema=../../schema/wfb-face-1.schema.json

format: 1

face:
  id: 22222222-3333-4444-5555-666666666666
  name: Graph
  version: 1.0.0

targets:
  - fenix8solar47mm
  - fenix8solar51mm
  - fr955

palette:
  bg: "#000000"
  fg: "#FFFFFF"
  dim: "#AAAAAA"
  accent: "#00AAFF"
  hot: "#FF5500"

elements:
  - id: background
    type: shape
    shape: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: palette.bg

  - id: clock
    type: text
    value: time.clock
    format: "{:%H:%M}"
    font: FONT_NUMBER_MILD
    at: { anchor: center, dy: -26% }
    color: palette.fg

  - id: hr_graph               # heart_rate: time-binned, iterator's own auto min/max
    type: graph
    at: { anchor: center, dy: -12% }
    size: { width: 62%, height: 13% }
    series: heart_rate
    range: 4h                  # a duration: bins by real time on-device
    buckets: 32                # time-binned only -- default would be 40
    style: line
    thickness: 2px
    color: palette.hot
    min: auto                  # the iterator's own getMin()/getMax()
    max: auto

  - id: steps_graph            # steps: an array, duration converted to a count at build time
    type: graph
    at: { anchor: center, dy: 4% }
    size: { width: 62%, height: 13% }
    series: steps               # ActivityMonitor.getHistory(), at most 7 days
    range: 7d                   # a bare count works just as well: range: 7
    style: bars
    bar_width: 6px
    color: palette.accent
    min: 0                      # a fixed floor: a bar chart of steps starts at 0
    max: auto

  - id: temp_graph              # forecast_temperature: the array itself is nullable
    type: graph
    at: { anchor: center, dy: 20% }
    size: { width: 62%, height: 13% }
    series: forecast_temperature
    range: 24h                  # converted to a 24-entry count at build time
    style: area                 # one fillPolygon; capped at 62 samples
    color: palette.fg
    min: auto
    max: auto
