# Coverage for `outline:` on `pattern` and `gauge`:
# a radial pattern (polygon, line and text parts, each copy ringed whole by
# moving its rotation centre), a linear one (moving its origin), an arc
# gauge ringed round its track, a bar gauge with no track ringed round its
# lit length, and a needle gauge ringed whole like a hand.
#
# A test fixture, not an example: tests/test_outline_pattern_gauge.py reads
# it, and tests/test_outline_build.py builds it for real.
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 4d8c1f73-6e2a-4b95-9c07-1a5f3e8d2b64
  name: OutlinePatternGauge
  version: 1.0.0

build:
  targets:
    - fenix8solar47mm
    - fenix8solar51mm
    - fr955

resources:
  palette:
    bg: "#000000"
    fg: "#FFFFFF"
    ring: "#FFFF00"
    accent: "#AA00FF"
    track: "#555555"

elements:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  ticks:
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 12
    step: 30deg
    color: color.accent
    outline: color.ring
    parts:
      - type: polygon
        points:
          - { dx: -3%r, dy: -92%r }
          - { dy: -82%r }
          - { dx: 3%r, dy: -92%r }
      - { type: line, at: { dy: -80%r }, to: { dy: -74%r }, thickness: 2px }

  numerals:
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 4
    step: 90deg
    color: color.bg
    outline: color.fg
    parts:
      - type: text
        text: "{copy * 3 + 12}"
        font: FONT_XTINY
        at: { dy: -64%r }

  dots:
    type: pattern
    pattern: linear
    at: { anchor: center, dx: -12%, dy: 12% }
    count: 5
    step: { dx: 6% }
    color: color.accent
    outline: color.ring
    parts:
      - { type: circle, radius: 2%r }

  battery_arc:
    type: gauge
    style: arc
    value: system.battery
    max: 100
    at: { anchor: center }
    radius: 50%r
    thickness: 5px
    start_angle: 240deg
    sweep: 240deg
    color: color.accent
    track_color: color.track
    outline: color.ring

  steps_bar:
    type: gauge
    style: bar
    value: activity.steps
    max: activity.step_goal
    at: { anchor: center, dy: 22% }
    size: { width: 40%, height: 4% }
    color: color.accent
    absent: hide
    outline: color.ring

  needle:
    type: gauge
    style: needle
    value: system.battery
    max: 100
    at: { anchor: center }
    start_angle: 240deg
    sweep: 240deg
    color: color.fg
    outline: color.bg
    needle:
      - type: polygon
        points: [{ dx: -3%r, dy: 10%r }, { dy: -44%r }, { dx: 3%r, dy: 10%r }]
      - { type: circle, radius: 4%r }

  hr_arc:
    type: gauge
    style: arc
    value: heart_rate.current
    max: 200
    at: { anchor: center }
    radius: 40%r
    thickness: 3px
    start_angle: 120deg
    sweep: 120deg
    color: color.accent
    absent: hide
    outline: color.ring
