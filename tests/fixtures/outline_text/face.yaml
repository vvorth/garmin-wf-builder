# Golden coverage for plan 15 slice 1 (`outline:` on a standalone `text`
# element) -- a background, a baked-font clock with a plain (upright)
# outline, an upright vector-font text with an outline (shorthand
# spelling), and one of each `curve:` style with an outline -- every draw
# shape a standalone element can take (plan 15 §14 slice 1).
#
# A test fixture, not an example: tests/test_text_outline_golden.py's
# goldens in tests/golden/ (outline_text__*) read it, and it is what
# tests/test_text_outline_codegen.py-equivalent assertions generate from
# directly.
#
# Build it with:  ./wfb.py build tests/fixtures/outline_text/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-1.schema.json

format: 1

face:
  id: 5d8e2a4f-6c1b-4a9d-8e3f-1b6c4a9d8e3f
  name: OutlineText
  version: 1.0.0

targets:
  - fenix8solar47mm
  - fenix8solar51mm
  - fr955

palette:
  bg: "#000000"
  text: "#FFFFFF"
  ring: "#FF5500"

fonts:
  clock:
    source: ../slice/assets/OpenSans-Regular.ttf
    size: 22%r

  bezel:
    face: [RobotoCondensedBold, RobotoCondensedRegular]
    size: 6%r

elements:
  - id: background
    type: shape
    shape: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: palette.bg

  - id: clock
    type: text
    value: time.clock
    format: "{:%h:%M}"
    font: font.clock
    at: { anchor: center, dy: -10% }
    color: palette.text
    outline: { color: palette.ring, width: 2 }

  - id: upright_vector
    type: text
    text: "UPRIGHT"
    font: font.bezel
    at: { anchor: center, dy: 30%r }
    color: palette.bg
    outline: palette.ring

  - id: brand
    type: text
    text: "GARMIN"
    font: font.bezel
    color: palette.bg
    at: { anchor: center, dy: -30%r }
    outline: { color: palette.ring, width: 1 }
    curve:
      style: angled
      angle: 45deg

  - id: bezel_text
    type: text
    text: "BEZEL"
    font: font.bezel
    color: palette.bg
    at: { anchor: center }
    outline: { color: palette.ring, width: 3 }
    curve:
      style: radial
      angle: 90deg
      radius: 44%r
      direction: clockwise
