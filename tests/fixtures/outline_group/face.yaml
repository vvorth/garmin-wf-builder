# Coverage for `outline:` on `group` (research 19, plan 23 D5): the union of
# overlapping members, a member's own ring inside the group's, a nested
# outlined group, a static outlined group (rings drawn into the buffer), a
# low-power one (rings in onPartialUpdate) and a data-bound member (its
# `ring<Id>` takes the same reads as its `draw<Id>`).
#
# A test fixture, not an example: tests/test_outline_group.py reads it, and
# tests/test_outline_build.py builds it for real.
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 0b7e4a19-2c5d-4e93-8f16-9d3a7c1e5b42
  name: OutlineGroup
  version: 1.0.0

build:
  targets:
    - fenix8solar47mm
    - fenix8solar51mm
    - fr955

resources:
  palette:
    bg: "#000000"
    fg: "#FFFFFF"
    ring: "#FFFF00"
    accent: "#00AAFF"

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  plaque:
    type: group
    at: { anchor: center, dy: -30% }
    size: { width: 40%, height: 12% }
    outline: { color: color.ring, width: 1 }
    children:
      plate:
        type: rectangle
        at: { anchor: center }
        size: { width: 30%, height: 8% }
        color: color.accent
      knob:
        type: circle
        at: { anchor: center, dx: 16% }
        radius: 4%r
        color: color.accent

elements:
  badge:
    type: group
    at: { anchor: center }
    size: { width: 40%, height: 20% }
    outline: { color: color.ring, width: 2 }
    children:
      disc:
        type: circle
        at: { anchor: center, dx: -6% }
        radius: 9%r
        color: color.accent
      heart:
        type: icon
        icon: heart
        size: 12%r
        at: { anchor: center, dx: 8% }
        color: color.accent
      rate:
        type: text
        text: "{heart_rate.current:d}"
        absent: "--"
        font: FONT_XTINY
        at: { anchor: center, dx: -6% }
        color: color.bg
        outline: { color: color.fg, width: 1 }
        lint:
          allow: [text-outline-interior]
          reason: "the ring is meant to cut into the disc beneath it"

  nest:
    type: group
    at: { anchor: center, dy: 28% }
    size: { width: 50%, height: 14% }
    outline: { color: color.fg, width: 1 }
    children:
      inner:
        type: group
        at: { anchor: center, dx: -8% }
        size: { width: 20%, height: 12% }
        outline: { color: color.ring, width: 1 }
        children:
          bar:
            type: rectangle
            at: { anchor: center }
            size: { width: 30px, height: 8px }
            color: color.accent
      dot:
        type: circle
        at: { anchor: center, dx: 12% }
        radius: 3%r
        color: color.accent

  seconds:
    type: group
    at: { anchor: center, dy: 14% }
    size: { width: 20%, height: 8% }
    outline: { color: color.ring, width: 1 }
    children:
      secs:
        type: text
        text: "{time.second:02d}"
        font: FONT_XTINY
        at: { anchor: center }
        color: color.fg
        sleep_update: true
