# `mypy --strict` over the compiler, ADR 0001's safeguard for Python's lack
# of exhaustiveness checking over IR node types. Run it as its own test set,
# against the known-error baseline (`tools/typecheck.py`):
#
#   ./.venv/bin/python -m pytest -m typecheck
#   ./.venv/bin/python tools/typecheck.py            # the same, as a report
#   ./.venv/bin/python tools/typecheck.py --update   # after fixing errors

[mypy]
python_version = 3.11
files = wfb
strict = True

# fontTools ships no type information; its three import sites stay typed on
# our side, the library itself reads as Any.
[mypy-fontTools.*]
ignore_missing_imports = True
