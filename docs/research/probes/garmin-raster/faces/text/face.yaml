# garmin-raster probe: drawText from a baked sheet, plain and anti-aliased
# Generated by make_faces.ts; edit that, not this.

format: 2

face:
  id: 0af0af71-c2d4-4fbd-8a98-0e1f4b4c8e53
  name: Raster text
  version: 1.0.0

build:
  targets: [fenix8solar47mm, fenix8solar51mm, fr955, fenix847mm]

resources:
  palette:
    bg: "#000000"
    ink: "#FFFFFF"
  fonts:
    mono: { source: ../../../../../../examples/showcase/assets/ChivoMono-Bold.ttf, size: 24px }
    smooth: { source: ../../../../../../examples/showcase/assets/ChivoMono-Bold.ttf, size: 24px, antialias: true }

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

elements:
  plain:
    type: text
    text: "0123456789"
    font: font.mono
    at: { anchor: center, dx: 0px, dy: -20px }
    color: color.ink
  smooth:
    type: text
    text: "0123456789"
    font: font.smooth
    at: { anchor: center, dx: 0px, dy: 20px }
    color: color.ink
