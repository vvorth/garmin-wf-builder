# garmin-raster probe: a radial pattern's polygons and lines, turned at runtime off the pixel grid
# Generated by make_faces.ts; edit that, not this.

format: 2

face:
  id: ee0e9b45-ba76-4f9d-8e56-22d17566e6f9
  name: Raster rotated
  version: 1.0.0

build:
  targets: [fenix8solar47mm, fenix8solar51mm, fr955, fenix847mm]

resources:
  palette:
    bg: "#000000"
    ink: "#FFFFFF"

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

elements:
  tri_outer:
    type: pattern
    pattern: radial
    count: 12
    at: { anchor: center }
    start: 7deg
    color: color.ink
    parts:
      - {type: polygon, points: [{dx: -3px, dy: -80px}, {dx: 3px, dy: -80px}, {dx: 0px, dy: -68px}]}
  bar_mid:
    type: pattern
    pattern: radial
    count: 9
    at: { anchor: center }
    start: 7deg
    color: color.ink
    parts:
      - {type: polygon, points: [{dx: -2px, dy: -56px}, {dx: 2px, dy: -56px}, {dx: 2px, dy: -44px}, {dx: -2px, dy: -44px}]}
  line2_inner:
    type: pattern
    pattern: radial
    count: 8
    at: { anchor: center }
    start: 7deg
    color: color.ink
    parts:
      - {type: line, at: {dy: -36px}, to: {dy: -26px}, thickness: 2px}
  line1_core:
    type: pattern
    pattern: radial
    count: 7
    at: { anchor: center }
    start: 7deg
    color: color.ink
    parts:
      - {type: line, at: {dy: -19px}, to: {dy: -9px}, thickness: 1px}
