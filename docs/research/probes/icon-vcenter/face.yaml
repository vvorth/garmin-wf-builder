# Probe: where TEXT_JUSTIFY_VCENTER puts a baked (BMFont) font's line top.
# Hand-written; README.md says how to build, patch and measure it.
#
# One row per icon size. On each row, left to right:
#   new_<row>  the compiler's centred icon: drawn top-justified at y - ceil(lineHeight/2)
#   old_<row>  the same glyph in the same font, which build.sh patches to the
#              old call: TEXT_JUSTIFY_CENTER | TEXT_JUSTIFY_VCENTER at y itself
#   text_<row> "H8" in a baked text font (Open Sans), drawn with VCENTER at y
# under a 1 px red reference line at y, the row's centre.
format: 2

face:
  id: 3c1d7e52-9a4b-4f60-8d2e-6b7f0a1c9e34
  name: Icon VCenter Probe
  version: 1.0.0

build:
  targets: [fenix8solar47mm, fenix8solar51mm, fr955]

resources:
  fonts:
    probe:
      source: ../../../../ts/test/fixtures/slice/assets/OpenSans-Regular.ttf
      size: 14%r
  palette:
    bg: "#000000"
    ink: "#FFFFFF"
    line: "#FF0000"

elements:
  background: { type: rectangle, at: { anchor: center }, size: { width: 100%, height: 100% }, color: color.bg }
  line_s10: { type: rectangle, at: { anchor: center, dy: -95px }, size: { width: 150px, height: 1px }, color: color.line }
  new_s10: { type: icon, icon: heart, size: 10%r, at: { anchor: center, dx: -50px, dy: -95px }, color: color.ink }
  old_s10: { type: icon, icon: heart, size: 10%r, at: { anchor: center, dx: -10px, dy: -95px }, align: top, color: color.ink, lint: { allow: [safe-area], reason: "build.sh redraws it centred on its row with VCENTER; the box assumes top" } }
  text_s10: { type: text, text: "H8", font: font.probe, at: { anchor: center, dx: 40px, dy: -95px }, color: color.ink }
  line_s15: { type: rectangle, at: { anchor: center, dy: -62px }, size: { width: 150px, height: 1px }, color: color.line }
  new_s15: { type: icon, icon: heart, size: 15%r, at: { anchor: center, dx: -50px, dy: -62px }, color: color.ink }
  old_s15: { type: icon, icon: heart, size: 15%r, at: { anchor: center, dx: -10px, dy: -62px }, align: top, color: color.ink, lint: { allow: [safe-area], reason: "build.sh redraws it centred on its row with VCENTER; the box assumes top" } }
  text_s15: { type: text, text: "H8", font: font.probe, at: { anchor: center, dx: 40px, dy: -62px }, color: color.ink }
  line_s20: { type: rectangle, at: { anchor: center, dy: -20px }, size: { width: 150px, height: 1px }, color: color.line }
  new_s20: { type: icon, icon: heart, size: 20%r, at: { anchor: center, dx: -50px, dy: -20px }, color: color.ink }
  old_s20: { type: icon, icon: heart, size: 20%r, at: { anchor: center, dx: -10px, dy: -20px }, align: top, color: color.ink, lint: { allow: [safe-area], reason: "build.sh redraws it centred on its row with VCENTER; the box assumes top" } }
  text_s20: { type: text, text: "H8", font: font.probe, at: { anchor: center, dx: 40px, dy: -20px }, color: color.ink }
  line_s25: { type: rectangle, at: { anchor: center, dy: 32px }, size: { width: 150px, height: 1px }, color: color.line }
  new_s25: { type: icon, icon: heart, size: 25%r, at: { anchor: center, dx: -50px, dy: 32px }, color: color.ink }
  old_s25: { type: icon, icon: heart, size: 25%r, at: { anchor: center, dx: -10px, dy: 32px }, align: top, color: color.ink, lint: { allow: [safe-area], reason: "build.sh redraws it centred on its row with VCENTER; the box assumes top" } }
  text_s25: { type: text, text: "H8", font: font.probe, at: { anchor: center, dx: 40px, dy: 32px }, color: color.ink }
  line_p30: { type: rectangle, at: { anchor: center, dy: 85px }, size: { width: 150px, height: 1px }, color: color.line }
  new_p30: { type: icon, icon: heart, size: 30px, at: { anchor: center, dx: -50px, dy: 85px }, color: color.ink }
  old_p30: { type: icon, icon: heart, size: 30px, at: { anchor: center, dx: -10px, dy: 85px }, align: top, color: color.ink, lint: { allow: [safe-area], reason: "build.sh redraws it centred on its row with VCENTER; the box assumes top" } }
  text_p30: { type: text, text: "H8", font: font.probe, at: { anchor: center, dx: 40px, dy: 85px }, color: color.ink }
