# Coverage for `outline:` on `hands`: each hand
# ringed whole, over the hand beneath it -- a polygon, a rectangle, a
# stroked line and circles, and an awake-only second hand whose ring sits
# inside its own `if (!_sleeping)`.
#
# A test fixture, not an example: tests/test_outline_hands.py reads it, and
# tests/test_outline_build.py builds it for real.
#
# yaml-language-server: $schema=../../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 6a2d9e17-5b3c-4f80-a1d4-2c7e9b0f5a36
  name: OutlineHands
  version: 1.0.0

build:
  targets:
    - fenix8solar47mm
    - fenix8solar51mm
    - fr955

resources:
  palette:
    bg: "#000000"
    fg: "#FFFFFF"
    track: "#AAAAAA"
    accent: "#FF5500"

  hand_sets:
    main:
      hour:
        color: color.fg
        parts:
          - type: polygon
            points:
              - { dx: -4%r, dy: 8%r }
              - { dy: -50%r }
              - { dx: 4%r, dy: 8%r }
      minute:
        color: color.fg
        parts:
          - { type: rectangle, at: { dy: -40%r }, size: { width: 3%r, height: 88%r } }
          - { type: circle, radius: 4%r }
      second:
        color: color.accent
        parts:
          - { type: line, at: { dy: 15%r }, to: { dy: -82%r }, thickness: 2px }
          - { type: circle, at: { dy: 15%r }, radius: 3%r }

elements:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.bg

  dial:
    type: circle
    at: { anchor: center }
    radius: 90%r
    thickness: 2px
    filled: false
    color: color.track

  hands:
    type: hands
    set: main
    at: { anchor: center }
    seconds: awake
    outline: { color: color.bg, width: 2 }
