# Navy Classic -- a three-hand dress face with a day-date window at 3,
# modelled on a photo of a navy sunray-dial automatic (build/preview/test.png).
# The original's brand wordmarks and shield are left out; the face's own
# name sits where the model name was.
#
# Preview:  ./wfb preview faces/navy-classic/face.yaml --time 10:10:37
# Build:    ./wfb build faces/navy-classic/face.yaml
#
# yaml-language-server: $schema=../../../schema/wfb-face-2.schema.json

format: 2

face:
  id: 5eb11642-3050-493b-958a-dd82d4a61df4
  name: Navy Classic
  version: 1.0.0

build:
  targets: [fenix8solar47mm, fenix8solar51mm, fr955, fenix847mm]

defaults:
  aod:
    dim: 0.6

resources:
  fonts:
    label: { face: [RobotoCondensedBold], size: 10%r }
  palette:                          # every channel 00 / 55 / AA / FF
    dial: "#000055"
    flange: "#000055"
    silver: "#AAAAAA"
    steel: "#555555"
    white: "#FFFFFF"
    black: "#000000"

  hand_sets:
    main:
      hour:
        color: color.white
        parts:
          - type: polygon
            points:
              - { dx: -4%r, dy: 19%r }
              - { dx: -4%r, dy: -52%r }
              - { dx: -1%r, dy: -57%r }
              - { dx: 1%r, dy: -57%r }
              - { dx: 4%r, dy: -52%r }
              - { dx: 4%r, dy: 19%r }
          - { type: line, at: { dy: 17%r }, to: { dy: -57%r }, thickness: 1px, color: color.silver }
      minute:
        color: color.white
        parts:
          - type: polygon
            points:
              - { dx: -3%r, dy: 12%r }
              - { dx: -3%r, dy: -80%r }
              - { dx: -1%r, dy: -83%r }
              - { dx: 1%r, dy: -83%r }
              - { dx: 3%r, dy: -80%r }
              - { dx: 3%r, dy: 12%r }
          - { type: circle, radius: 5%r }
          - { type: circle, radius: 4%r, color: color.silver }
          - { type: line, at: { dy: 10%r }, to: { dy: -83%r }, thickness: 1px, color: color.silver }
      second:
        color: color.silver
        parts:
          - type: polygon
            points:
              - { dx: 0%r, dy: -90%r }
              - { dx: -3%r, dy: 30%r }
              - { dx: 3%r, dy: 30%r }
              - { dx: 1%r, dy: -90%r }
        # - { shape: line, at: { dy: 12%r }, to: { dy: -89%r }, thickness: 3px }
        # - shape: polygon
        #   points:
        #     - { dx: -1%r, dy: 8%r }
        #     - { dx: -3%r, dy: 30%r }
        #     - { dx: 3%r, dy: 30%r }
        #     - { dx: 1%r, dy: 8%r }
          - { type: circle, radius: 2.5%r }

static:
  background:
    type: rectangle
    at: { anchor: center }
    size: { width: 100%, height: 100% }
    color: color.flange
  dial:
    type: circle
    at: { anchor: center }
    radius: 88%r
    color: color.dial
  flange_edge:
    lint: { allow: [contrast], reason: "a deliberately faint rehaut edge, as on the original dial" }
    type: circle
    filled: false
    at: { anchor: center }
    radius: 88%r
    thickness: 1px
    color: color.steel
  minute_ticks:
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 60
    skip_every: 5
    color: color.silver
    parts: [{ type: line, at: { dy: -94%r }, to: { dy: -89%r }, thickness: 1px }]
  rim_serration:
    lint: { allow: [contrast, safe-area], reason: "deliberately faint flange serration at the very rim, as on the original dial" }
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 120
    color: color.steel
    parts: [{ type: line, at: { dy: -99%r }, to: { dy: -96%r }, thickness: 1px }]
  hour_dots:
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 12
    skip: [3]
    color: color.white
    parts: [{ type: circle, at: { dy: -92%r }, radius: 1.2%r }]
  hour_batons:
    type: pattern
    pattern: radial
    at: { anchor: center }
    count: 12
    skip: [0, 3]
    color: color.white
    parts:
      - { type: rectangle, at: { dy: -78%r }, size: { width: 6%r, height: 19%r }, color: color.silver }
      - { type: rectangle, at: { dy: -78%r }, size: { width: 3.5%r, height: 17%r } }
  baton_12:
    type: group
    at: { anchor: center }
    children:
      b12_b: { type: rectangle, at: { anchor: center, dy: -78%r }, size: { width: 12%r, height: 19%r }, color: color.silver }
      b12_l: { type: rectangle, at: { anchor: center, dx: -3%r, dy: -78%r }, size: { width: 3.5%r, height: 17%r }, color: color.white }
      b12_r: { type: rectangle, at: { anchor: center, dx: 3%r, dy: -78%r }, size: { width: 3.5%r, height: 17%r }, color: color.white }
  marker_3:
    type: polygon
    color: color.white
    points:
      - { anchor: center, dx: 86%r }
      - { anchor: center, dx: 91%r, dy: -2%r }
      - { anchor: center, dx: 91%r, dy: 2%r }
  name_label:
    type: text
    text: "CLASSIC"
    font: font.label
    at: { anchor: center, dy: -45%r }
    color: color.white
  auto_label:
    type: text
    text: "AUTOMATIC"
    font: font.label
    at: { anchor: center, dy: 38%r }
    color: color.white
  date_frame:
    type: rectangle
    at: { anchor: center, dx: 51%r, dy: 2%r }
    size: { width: 59%r, height: 19%r }
    color: color.silver
  day_window:
    lint: { allow: [contrast], reason: "drawn inside the silver date_frame, not on the dial" }
    type: rectangle
    at: { anchor: center, dx: 40%r, dy: 2%r }
    size: { width: 34%r, height: 16%r }
    color: color.black
  date_window:
    lint: { allow: [contrast], reason: "drawn inside the silver date_frame, not on the dial" }
    type: rectangle
    at: { anchor: center, dx: 69.5%r, dy: 2%r }
    size: { width: 19%r, height: 16%r }
    color: color.black

elements:
  weekday:
    type: text
    text: >-
      {(date.weekday == 1 ? "SUN" : date.weekday == 2 ? "MON" :
      date.weekday == 3 ? "TUE" : date.weekday == 4 ? "WED" :
      date.weekday == 5 ? "THU" : date.weekday == 6 ? "FRI" : "SAT")}
    font: FONT_XTINY
    at: { anchor: center, dx: 40%r, dy: 2%r }
    color: color.white
  day:
    type: text
    text: "{date.day:d}"
    font: FONT_XTINY
    at: { anchor: center, dx: 69.5%r, dy: 2%r }
    color: color.white
  auto_dash:                        # the dash stands in when nothing is unread
    type: line
    visible: "device.notification_count == 0"
    at: { anchor: center, dx: -2%r, dy: 47%r }
    to: { anchor: center, dx: 2%r, dy: 47%r }
    thickness: 1px
    color: color.white
  notifications:
    type: text
    visible: "device.notification_count > 0"
    text: "{device.notification_count:d}"
    font: font.label
    at: { anchor: center, dy: 48%r }
    color: color.white
  hands:
    lint: { allow: [antialias-dither], reason: "soft hand edges are wanted; the 64-colour panel dithers them" }
    type: hands
    set: main
    at: { anchor: center }
    seconds: awake
    # antialias: true
    aod:
      visible: true
  hub:
    lint: { allow: [contrast], reason: "the axle sits on the silver second-hand disc, not on the dial" }
    type: circle
    at: { anchor: center }
    radius: 1%r
    color: color.steel
