
services:
  garmin-wf-builder:
    container_name: garmin-wf-builder
    image: garmin-wf-builder:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    user: 1000:1000
    restart: unless-stopped
    ports:
      - 8765:8765
    # environment:
    #   # Let the image download Garmin's newest SDK when none is mounted
    #   # (into /sdk when writable, else /cache). Setting this accepts the
    #   # Connect IQ Developer Agreement, as downloading from Garmin's page does.
    #   WFB_ACCEPT_LICENSE: "1"
    #   # No daily check of Garmin's release list for a newer SDK.
    #   WFB_NO_UPDATE_CHECK: "1"
    volumes:
      # The SDK Manager's folders (macOS paths; Linux keeps them under
      # ~/.Garmin/ConnectIQ): the SDK, the device definitions, and Garmin's
      # own font files (optional). `docker run --rm garmin-wf-builder init`
      # says how to get them.
      - ~/Library/Application Support/Garmin/ConnectIQ/Sdks:/sdk:ro
      - ~/Library/Application Support/Garmin/ConnectIQ/Devices:/devices:ro
      - ~/Library/Application Support/Garmin/ConnectIQ/Fonts:/fonts:ro
      - wfb-keys:/keys:rw
      # The compiler's writable copy and the device reference extracted from
      # the SDK's pages, kept between runs (optional).
      - wfb-cache:/cache:rw

    # deploy:
    #   resources:
    #     limits:
    #       memory: 2048M
    #     reservations:
    #       memory: 1G

volumes:
  wfb-keys:
    external: true
  wfb-cache:
