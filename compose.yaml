
services:
  garmin-wf-builder:
    container_name: garmin-wf-builder
    image: garmin-wf-builder:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    user: 1000:1000
    restart: unless-stopped
    ports:
      - 8765:8765
    # environment:
    #   # Let the image download Garmin's newest SDK when none is mounted
    #   # (into /vendor/Sdks when writable, else /cache). Setting this accepts the
    #   # Connect IQ Developer Agreement, as downloading from Garmin's page does.
    #   WFB_ACCEPT_LICENSE: "1"
    #   # No daily check of Garmin's release list for a newer SDK.
    #   WFB_NO_UPDATE_CHECK: "1"
    volumes:
      # The SDK Manager's folder (the macOS path; Linux keeps it at
      # ~/.Garmin/ConnectIQ), with the SDK (Sdks), the device definitions
      # (Devices) and Garmin's own font files (Fonts, optional) inside.
      # `docker run --rm garmin-wf-builder init` says how to get them.
      - ~/Library/Application Support/Garmin/ConnectIQ:/vendor:ro
      - wfb-keys:/keys:rw
      # The compiler's writable copy and the device reference extracted from
      # the SDK's pages, kept between runs (optional).
      - wfb-cache:/cache:rw

    # deploy:
    #   resources:
    #     limits:
    #       memory: 2048M
    #     reservations:
    #       memory: 1G

volumes:
  wfb-keys:
    external: true
  wfb-cache:
